<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worlds Service Cabinet - Mockup</title>
  <style>
    /* design-systems/skeumorphism/tokens.css
     * Structured token bindings for Skeuomorphism.
     * skeuomorphic interface with tactile surfaces, beveled cards, and warm analog depth.
     */

    :root {
      --bg: #f7eee6;
      --surface: #fff8f1;
      --surface-warm: #ead6c7;
      --fg: #2b211c;
      --fg-2: #5a4b43;
      --muted: #8a7a70;
      --meta: #b46a46;
      --border: #dac8b9;
      --border-soft: #eaded4;
      --accent: #b46a46;
      --accent-on: #ffffff;
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success: #4d8f5a;
      --warn: #c88735;
      --danger: #b84c4c;
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: Inter, system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 24px;
      --text-2xl: 36px;
      --text-3xl: 54px;
      --text-4xl: 76px;
      --leading-body: 1.52;
      --leading-tight: 1.06;
      --tracking-display: -0.025em;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --section-y-desktop: 96px;
      --section-y-tablet: 68px;
      --section-y-phone: 48px;
      --radius-sm: 14px;
      --radius-md: 22px;
      --radius-lg: 34px;
      --radius-pill: 9999px;
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 8px 10px 24px rgba(128, 92, 70, 0.18), -8px -8px 20px rgba(255, 255, 255, 0.70);
      --focus-ring: 0 0 0 4px rgba(180, 106, 70, 0.24);
      --motion-fast: 150ms;
      --motion-base: 240ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      --container-max: 1180px;
      --container-gutter-desktop: 36px;
      --container-gutter-tablet: 24px;
      --container-gutter-phone: 16px;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
    body { margin: 0; min-width: 0; min-height: 100dvh; line-height: var(--leading-body); }
    button, input { font: inherit; color: inherit; }
    button, a, input, label { -webkit-tap-highlight-color: transparent; }
    button, .button-link, input[type="checkbox"] + label { min-height: 44px; }
    button, .button-link { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 10px 15px; font-weight: 600; letter-spacing: .02em; cursor: pointer; box-shadow: var(--elev-ring); }
    button:hover, .button-link:hover { background: var(--surface-warm); color: var(--fg); }
    button:active, .button-link:active { transform: translateY(1px); }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: none; box-shadow: var(--focus-ring), 0 0 0 1px var(--accent); }
    button[disabled] { cursor: not-allowed; opacity: .62; }
    a { color: var(--fg); text-underline-offset: 3px; }
    h1, h2, h3 { margin: 0; font-family: var(--font-display); line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }
    h1 { font-size: clamp(32px, 5vw, 54px); max-width: 14ch; }
    h2 { font-size: clamp(28px, 3.4vw, 36px); }
    h3 { font-size: var(--text-xl); }
    p { margin: 0; max-width: 65ch; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .app-shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100dvh; }
    .rail { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; padding: var(--space-6); border-right: 1px solid var(--border); background: color-mix(in oklab, var(--bg), var(--surface) 34%); }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-8); }
    .wordmark { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 700; }
    .mockup { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 8px; border: 1px solid var(--accent); border-radius: var(--radius-pill); color: var(--fg); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; }
    .shell-nav { display: grid; gap: var(--space-2); }
    .nav-button { width: 100%; text-align: left; border-color: transparent; background: transparent; box-shadow: none; }
    .nav-button[aria-current="page"] { background: var(--surface); border-color: var(--border); box-shadow: inset 4px 0 0 var(--accent); }
    .rail-note { margin-top: auto; color: var(--fg-2); font-size: var(--text-sm); }
    .main { min-width: 0; padding: var(--space-8) clamp(16px, 4vw, 48px) 64px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-6); margin: 0 auto var(--space-8); max-width: var(--container-max); }
    .page-head p { margin-top: var(--space-3); color: var(--fg-2); font-size: var(--text-lg); }
    .home-summary { flex: 0 0 auto; min-width: 175px; padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .home-summary strong { display: block; font-family: var(--font-display); font-size: 28px; }
    .home-summary span { color: var(--fg-2); font-size: var(--text-sm); }
    .workspace { max-width: var(--container-max); margin: 0 auto; display: grid; grid-template-columns: minmax(240px, .62fr) minmax(0, 1.38fr); gap: var(--space-6); align-items: start; }
    .panel { border: 1px solid var(--border); border-radius: var(--radius-lg); background: color-mix(in oklab, var(--bg), var(--surface) 42%); }
    .panel-pad { padding: var(--space-6); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); }
    .panel-head h2 { font-size: var(--text-xl); }
    .cabinet-list { display: grid; gap: var(--space-3); }
    .bay { width: 100%; min-height: 92px; display: grid; grid-template-columns: 6px 1fr auto; gap: var(--space-3); align-items: center; text-align: left; padding: var(--space-3); background: var(--surface); }
    .bay[aria-selected="true"] { border-color: var(--fg-2); box-shadow: var(--elev-raised); }
    .state-marker { width: 6px; height: 34px; border-radius: var(--radius-pill); background: var(--border); }
    .state-marker.healthy { background: var(--success); }
    .state-marker.needs_attention { background: var(--warn); }
    .state-marker.unavailable { background: var(--danger); }
    .bay-name { display: block; font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; letter-spacing: -.01em; }
    .bay-kind, .meta { color: var(--fg-2); font-size: var(--text-sm); }
    .state-word { display: inline-flex; align-items: center; min-height: 28px; padding: 2px 9px; border: 1px solid currentColor; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: 700; white-space: nowrap; }
    .empty-bay { padding: var(--space-6); border: 1px dashed var(--border); border-radius: var(--radius-md); text-align: center; color: var(--fg-2); }
    .detail { min-width: 0; }
    .detail-top { display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-6) var(--space-6) var(--space-4); }
    .detail-title-wrap { min-width: 0; }
    .owner-line { margin-top: var(--space-2); color: var(--fg-2); }
    .back-button { display: none; margin-bottom: var(--space-4); }
    .disconnect { align-self: start; color: var(--danger); }
    .dock { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(300px, .94fr); gap: var(--space-4); padding: 0 var(--space-4) var(--space-4); }
    .inset { min-width: 0; border: 10px solid var(--fg-2); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--elev-raised); overflow: hidden; }
    .inset-lip { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-3); border-bottom: 1px solid var(--border); background: var(--surface-warm); }
    .inset-lip strong { font-family: var(--font-display); }
    .app-frame { min-height: 300px; padding: var(--space-5); background: var(--surface); }
    .app-frame h3 { margin-bottom: var(--space-3); }
    .app-frame p { color: var(--fg-2); }
    .app-surface { margin-top: var(--space-5); display: grid; gap: var(--space-3); }
    .embedded-frame { display: block; width: 100%; min-height: 164px; margin-top: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
    .app-reading { padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
    .app-reading strong { display: block; margin-top: var(--space-1); font-size: var(--text-lg); }
    .frame-fallback { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3); border-top: 1px solid var(--border); font-size: var(--text-sm); }
    .facts { min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); padding: var(--space-5); }
    .facts > p { margin-top: var(--space-2); color: var(--fg-2); font-size: var(--text-sm); }
    .fact-list { display: grid; gap: var(--space-3); margin-top: var(--space-5); }
    .fact { padding: var(--space-4); border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--elev-ring); }
    .fact-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
    .fact-value { margin-top: var(--space-2); font-size: var(--text-lg); font-weight: 700; overflow-wrap: anywhere; }
    .fact-meta { margin-top: var(--space-3); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); color: var(--fg-2); font-size: var(--text-xs); }
    .permission { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-soft); font-size: var(--text-sm); }
    .permission strong { font-family: var(--font-mono); font-size: var(--text-xs); }
    .disabled-permission { width: 100%; margin-top: var(--space-2); text-align: left; font-weight: 500; }
    .reason { margin-top: var(--space-2); color: var(--fg-2); font-size: var(--text-xs); }
    .action-row { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-4); }
    .primary { border-color: var(--fg); background: var(--fg); color: var(--surface); }
    .primary:hover { background: var(--fg-2); color: var(--surface); }
    .marker-action { box-shadow: inset 4px 0 0 var(--accent), var(--elev-ring); }
    .inline-notice { margin-top: var(--space-4); padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .view-panel { max-width: var(--container-max); margin: 0 auto; }
    .facts-table { display: grid; gap: var(--space-3); margin-top: var(--space-6); }
    .agent-row { padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .agent-row-grid { display: grid; grid-template-columns: minmax(180px, 1.3fr) repeat(4, minmax(105px, .7fr)); gap: var(--space-3); align-items: start; }
    .agent-row .cell-label { display: block; color: var(--muted); font-size: var(--text-xs); letter-spacing: .02em; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-6); }
    .settings-card { padding: var(--space-5); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }

    .connect-card { max-width: 760px; margin: 0 auto; padding: clamp(20px, 4vw, 36px); }
    .step-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-2); margin: var(--space-6) 0; }
    .step-dot { min-height: 8px; border-radius: var(--radius-pill); background: var(--border); }
    .step-dot.done { background: var(--fg-2); }
    .step-dot.current { background: var(--accent); }
    .step-copy { margin-top: var(--space-2); color: var(--fg-2); }
    .field { display: grid; gap: var(--space-2); margin-top: var(--space-6); }
    .field label { font-weight: 700; }
    .field input[type="text"] { min-height: 48px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .field input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
    .helper, .validation { color: var(--fg-2); font-size: var(--text-sm); }
    .validation.error { color: var(--danger); }
    .validation.good { color: var(--success); }
    .choice-list { display: grid; gap: var(--space-3); margin-top: var(--space-6); }
    .choice { display: grid; grid-template-columns: 24px 1fr; gap: var(--space-3); align-items: start; min-height: 52px; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .choice input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--fg); }
    .choice label { min-height: 0; cursor: pointer; }
    .connect-actions { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-8); }
    .test-status { margin-top: var(--space-6); padding: var(--space-5); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .busy-bar { height: 8px; margin-top: var(--space-4); border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
    .busy-bar::after { content: ""; display: block; width: 38%; height: 100%; background: var(--fg-2); animation: checking 1.1s ease-in-out infinite alternate; }
    @keyframes checking { to { transform: translateX(164%); } }
    .toast { position: fixed; right: var(--space-6); bottom: var(--space-6); max-width: 420px; padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--fg); color: var(--surface); box-shadow: var(--elev-raised); z-index: 5; }
    .toast[hidden] { display: none; }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 176px minmax(0, 1fr); }
      .rail { padding: var(--space-4); }
      .workspace, .dock { grid-template-columns: 1fr; }
      .agent-row-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .app-shell { display: block; padding-bottom: 76px; }
      .rail { position: fixed; z-index: 4; inset: auto 0 0; width: 100%; height: 72px; padding: 8px; border: 1px solid var(--border); border-width: 1px 0 0; background: var(--bg); }
      .brand, .rail-note { display: none; }
      .shell-nav { grid-template-columns: repeat(4, 1fr); gap: 4px; }
      .nav-button { padding: 8px 4px; text-align: center; font-size: var(--text-xs); }
      .nav-button[aria-current="page"] { box-shadow: inset 0 3px 0 var(--accent); }
      .main { padding: var(--space-5) var(--container-gutter-phone) var(--space-8); }
      .page-head { display: block; margin-bottom: var(--space-5); }
      .home-summary { margin-top: var(--space-4); }
      .workspace { display: block; }
      .workspace.mobile-detail .register { display: none; }
      .workspace:not(.mobile-detail) .detail { display: none; }
      .back-button { display: inline-flex; align-items: center; }
      .panel, .facts, .inset { border-radius: var(--radius-md); }
      .detail-top { display: block; padding: var(--space-4); }
      .disconnect { margin-top: var(--space-4); }
      .dock { padding: 0 var(--space-3) var(--space-3); }
      .app-frame { min-height: 260px; padding: var(--space-4); }
      .fact-meta, .settings-grid, .agent-row-grid { grid-template-columns: 1fr; }
      .agent-row-grid > div { padding-bottom: var(--space-2); }
      .step-track { gap: 4px; }
      .toast { right: var(--space-3); bottom: 84px; left: var(--space-3); }
      h1 { font-size: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
    (() => {
      "use strict";

      const serviceFixture = {
        "media-shelf": {
          id: "media-shelf", name: "Media Shelf", kind: "media library", state: "healthy", stateLabel: "Healthy",
          summary: "Library reachable and indexing is current.", owner: "Media", fallback: "Open Media app", href: "https://example.invalid/app/media",
          facts: [
            fact("media.items", "Items in library", 1284, "items", "live", "2026-10-13T14:23:58Z", "local", "read", "read"),
            fact("media.indexing", "Indexing backlog", 0, "items", "live", "2026-10-13T14:23:58Z", "local", "read", "read"),
            fact("media.played-recently", "Played in the last 7 days", 12, "items", "live", "2026-10-13T14:23:58Z", "local", "read", "read")
          ]
        },
        "front-door": {
          id: "front-door", name: "Front Door", kind: "home access", state: "needs_attention", stateLabel: "Needs a human",
          summary: "Back door has been unlocked for longer than the person's usual window.", attentionReason: "A decision is required; the local app will not act on its own.",
          owner: "Home", fallback: "Open Home app", href: "https://example.invalid/app/home",
          facts: [
            fact("frontdoor.back-door", "Back door", "unlocked", null, "live", "2026-10-13T14:24:02Z", "local", "read", "act", null, "Locking the door changes the external system and is the person's decision."),
            fact("frontdoor.unlocked-for", "Unlocked for", 47, "minutes", "live", "2026-10-13T14:24:02Z", "local", "read", "read"),
            fact("frontdoor.guest-code-used", "Guest code last used by", "visitor-3", null, "live", "2026-10-13T14:20:11Z", "local", "none", "read", "Identifying a person is human-only in this fixture; the agent sees that a guest code was used, not who.")
          ]
        },
        "notes-sync": {
          id: "notes-sync", name: "Notes Sync", kind: "sync", state: "unavailable", stateLabel: "Unavailable",
          summary: "The sync provider did not answer its last two checks. Local notes still work; retry is offered.",
          owner: "Memory", fallback: "Open Memory app", href: "https://example.invalid/app/memory",
          facts: [
            fact("sync.provider-reachable", "Provider reachable", null, null, "unavailable", "2026-10-13T14:20:00Z", "external", "read", "read"),
            fact("sync.local-pending", "Local notes waiting to upload", 3, "notes", "live", "2026-10-13T14:23:30Z", "local", "read", "read"),
            fact("sync.last-synced", "Last successful sync", "2026-10-13T13:58:00Z", null, "stale", "2026-10-13T13:58:00Z", "local", "read", "read")
          ]
        }
      };

      function fact(id, label, value, unit, state, observedAt, source, agent, human, agentReason, humanReason) {
        return { id, label, value, unit, state, observedAt, source, permissions: { agent, human, agentReason, humanReason } };
      }

      const state = {
        view: "home",
        connected: ["media-shelf", "front-door"],
        selected: "front-door",
        mobileDetail: false,
        connectStep: 0,
        credentialRef: "",
        credentialDirty: false,
        credentialTouched: false,
        credentialSubmitted: false,
        testStatus: "idle",
        testFailedOnce: false,
        publishFacts: new Set(["sync.provider-reachable", "sync.local-pending", "sync.last-synced"]),
        attentionCount: 1,
        lastInvokingBay: null,
        disconnectedMessage: "",
        handoffMessage: ""
      };

      const app = document.querySelector("#app");
      const toast = document.querySelector("#toast");

      function cloneService(id) {
        return JSON.parse(JSON.stringify(serviceFixture[id]));
      }
      const store = {
        services: {
          "media-shelf": cloneService("media-shelf"),
          "front-door": cloneService("front-door"),
          "notes-sync": cloneService("notes-sync")
        }
      };

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
      }
      function valueText(f) {
        if (f.value === null || f.value === undefined) return f.state === "unknown" ? "Unknown" : f.state === "unavailable" ? "Unavailable" : "Not configured";
        return `${f.value}${f.unit ? ` ${f.unit}` : ""}`;
      }
      function showToast(message) {
        toast.textContent = message;
        toast.hidden = false;
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => { toast.hidden = true; }, 5200);
      }
      function navButton(id, label) {
        return `<button class="nav-button" data-nav="${id}" ${state.view === id ? 'aria-current="page"' : ""}>${label}</button>`;
      }
      function shell(content) {
        return `<div class="app-shell">
          <aside class="rail" aria-label="Worlds shell">
            <div class="brand"><span class="wordmark">Worlds</span><span class="mockup">MOCKUP</span></div>
            <nav class="shell-nav" aria-label="Primary">${navButton("home","Home")}${navButton("connect","Connect")}${navButton("memory","Memory")}${navButton("settings","Settings")}</nav>
            <p class="rail-note">Synthetic fixture. No provider calls or external actions occur.</p>
          </aside>
          <main class="main" id="main-content">${content}</main>
        </div>`;
      }

      function pageHead(title, description, summary) {
        return `<header class="page-head" data-od-id="page-heading"><div><h1>${title}</h1><p>${description}</p></div>${summary || ""}</header>`;
      }
      function homeView() {
        const summary = `<div class="home-summary" data-od-id="attention-summary"><strong>${state.attentionCount}</strong><span>${state.attentionCount === 1 ? "service needs you" : "services need you"}</span></div>`;
        return pageHead("Every service has a place.", "The cabinet gives every service a place and every fact a source.", summary) + cabinetWorkspace();
      }
      function cabinetWorkspace() {
        const services = state.connected.map(id => store.services[id]);
        const selected = store.services[state.selected];
        return `<div class="workspace ${state.mobileDetail ? "mobile-detail" : ""}" data-od-id="service-workspace">
          <section class="panel panel-pad register" aria-labelledby="cabinet-heading" data-od-id="cabinet-register">
            <div class="panel-head"><h2 id="cabinet-heading">Service cabinet</h2><button id="add-service" class="marker-action">Add service</button></div>
            <div class="cabinet-list" role="listbox" aria-label="Connected services">${services.length ? services.map(bayTemplate).join("") : emptyCabinet()}</div>
            ${state.disconnectedMessage ? `<p class="inline-notice" role="status">${esc(state.disconnectedMessage)}</p>` : ""}
          </section>
          <section class="panel detail" aria-label="Selected service detail">${selected ? detailTemplate(selected) : `<div class="panel-pad"><h2>No bay selected</h2><p>Choose a connected service from the cabinet.</p></div>`}</section>
        </div>`;
      }
      function emptyCabinet() {
        return `<div class="empty-bay"><h3>Vacant cabinet</h3><p>Worlds and local Memory still work. Connect a provider to add its first bay.</p></div>`;
      }
      function bayTemplate(s) {
        return `<button class="bay" role="option" aria-selected="${state.selected === s.id}" data-service="${s.id}" data-od-id="service-bay-${s.id}">
          <span class="state-marker ${s.state}" aria-hidden="true"></span>
          <span><span class="bay-name">${s.name}</span><span class="bay-kind">${s.kind}</span></span>
          <span class="state-word">${s.stateLabel}</span>
        </button>`;
      }
      function detailTemplate(s) {
        return `<button class="back-button" data-back-register>Back to services</button>
          <div class="detail-top">
            <div class="detail-title-wrap"><h2 tabindex="-1" id="detail-heading" data-od-id="service-detail-heading">${s.name}</h2><p class="owner-line">Owned by ${s.owner}. ${s.summary}</p></div>
            <button id="disconnect" class="disconnect" aria-label="Disconnect ${s.name}">Disconnect</button>
          </div>
          <div class="dock" data-od-id="owner-fact-dock">
            ${appFrame(s)}
            ${factsCard(s)}
          </div>`;
      }
      function appFrame(s) {
        const primary = s.facts[0];
        const framedDocument = `<!doctype html><html><head><meta charset="utf-8"><style>html{color-scheme:light;font:15px system-ui,sans-serif;background:Canvas;color:CanvasText}body{margin:0;padding:20px}small{opacity:.72}strong{display:block;margin:8px 0;font:700 24px Georgia,serif}.state{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 9px;font-size:12px}</style></head><body><small>${esc(s.owner)} app</small><strong>${esc(primary.label)}</strong><span>${esc(valueText(primary))}</span><p class="state">${esc(primary.state)}</p></body></html>`;
        let action = "";
        if (s.id === "front-door") action = `<button id="simulate-change" class="primary">Review lock in Project Home</button>`;
        if (s.id === "notes-sync") action = `<button data-owner-action="notes-sync">Check provider in Memory</button>`;
        return `<section class="inset" aria-labelledby="app-frame-title" data-od-id="embedded-app-frame">
          <div class="inset-lip"><strong id="app-frame-title">${s.name}</strong><span class="state-word">${s.stateLabel}</span></div>
          <div class="app-frame">
            <p class="meta">${s.owner} app view</p><h3>${primary.label}</h3><p>The embedded view is contained inside this owner bay. No Worlds credential is passed to it.</p>
            <iframe class="embedded-frame" title="Embedded ${esc(s.owner)} app view" sandbox srcdoc="${esc(framedDocument)}"></iframe>
            <div class="app-surface">${action}</div>
            ${state.handoffMessage && state.selected === s.id ? `<p class="inline-notice" role="status">${esc(state.handoffMessage)}</p>` : ""}
          </div>
          <div class="frame-fallback"><span>If embedding is unavailable, use the owning app.</span><a href="${s.href}" target="_blank" rel="noreferrer">${s.fallback}</a></div>
        </section>`;
      }
      function factsCard(s) {
        return `<aside class="facts" aria-labelledby="facts-heading" data-od-id="shared-facts-card"><h3 id="facts-heading">Shared facts</h3><p>One record supplies Home, this bay, and Agent facts.</p><div class="fact-list">${s.facts.map(factTemplate).join("")}</div></aside>`;
      }
      function factTemplate(f) {
        const p = f.permissions;
        const agentControl = p.agent === "none" ? `<button class="disabled-permission" disabled aria-describedby="reason-${f.id}">Agent access: none</button><p id="reason-${f.id}" class="reason">${esc(p.agentReason)}</p>` : `<p><strong>Agent can see:</strong> ${p.agent}</p>`;
        const act = p.human === "act" ? "Human acts in owning system" : `Human can see: ${p.human}`;
        return `<article class="fact" data-od-id="fact-${f.id}"><div class="fact-head"><strong>${f.label}</strong><span class="state-word">${f.state}</span></div><p class="fact-value">${esc(valueText(f))}</p><div class="fact-meta"><span>Source: ${f.source}</span><span>Observed: ${f.observedAt || "Unknown"}</span></div><div class="permission">${agentControl}<p><strong>Who can act:</strong> ${act}</p>${p.humanReason ? `<p class="reason">${esc(p.humanReason)}</p>` : ""}</div></article>`;
      }

      function memoryView() {
        const allFacts = state.connected.flatMap(id => store.services[id].facts.map(f => ({...f, service: store.services[id].name})));
        return pageHead("Agent facts", "The same fact records shown in Home and each service bay, with permissions kept explicit.") + `<section class="view-panel" data-od-id="agent-facts-view"><div class="panel panel-pad"><div class="panel-head"><h2>Visible records</h2><span class="state-word">${allFacts.length} facts</span></div><div class="facts-table">${allFacts.map(agentRow).join("") || `<div class="empty-bay">No provider facts. Local Memory remains available.</div>`}</div></div></section>`;
      }
      function agentRow(f) {
        const none = f.permissions.agent === "none" ? `<button disabled class="disabled-permission" aria-describedby="agent-reason-${f.id}">None</button><span id="agent-reason-${f.id}" class="reason">${esc(f.permissions.agentReason)}</span>` : esc(f.permissions.agent);
        const actor = f.permissions.human === "act" ? "Human in owning app" : "No external action";
        return `<article class="agent-row" data-od-id="agent-fact-${f.id}"><div class="agent-row-grid"><div><span class="cell-label">Fact</span><strong>${f.label}</strong><p>${esc(valueText(f))}</p></div><div><span class="cell-label">Source</span>${f.source}<br><span class="state-word">${f.state}</span></div><div><span class="cell-label">Observed</span>${f.observedAt || "Unknown"}</div><div><span class="cell-label">Agent sees</span>${none}</div><div><span class="cell-label">Who acts</span>${actor}</div></div></article>`;
      }
      function settingsView() {
        return pageHead("Worlds settings", "Shell settings remain available even when every provider is disconnected.") + `<section class="view-panel"><div class="settings-grid"><article class="settings-card"><h3>Local Worlds</h3><p>Available. The cabinet and navigation run locally in this mockup.</p></article><article class="settings-card"><h3>Disconnect history</h3><p>Historical retention is UNKNOWN. This mockup only reports what disappeared from the current cabinet.</p></article></div></section>`;
      }

      function credentialKind(value) {
        const v = value.trim();
        if (!v) return "empty";
        if (/^(sk-|token[=:]|bearer\s|eyJ|password[=:])/i.test(v) || v.length > 80) return "secret";
        if (/^(credential|vault|keyring|ref):\/\/[a-z0-9._/-]+$/i.test(v)) return "valid";
        return "invalid";
      }
      function connectView() {
        const steps = ["Discover", "Credential reference", "Safe test", "Preview", "Choose to publish", "Publish"];
        return pageHead("Connect Notes Sync", "Six visible steps. This mock UI does not contact a provider.") + `<section class="panel connect-card" data-od-id="connect-flow"><div class="panel-head"><h2>${steps[state.connectStep]}</h2><span>Step ${state.connectStep + 1} of 6</span></div><div class="step-track" aria-label="Connect progress">${steps.map((x,i)=>`<span class="step-dot ${i < state.connectStep ? "done" : i === state.connectStep ? "current" : ""}" title="${x}"></span>`).join("")}</div>${connectStepBody()}${connectActions()}</section>`;
      }
      function connectStepBody() {
        if (state.connectStep === 0) return `<div><h3>Notes Sync</h3><p class="step-copy">Unavailable. Owned by Memory. Local notes still work while the provider cannot be reached.</p><div class="test-status"><strong>Discovered owner</strong><p>Memory app</p></div></div>`;
        if (state.connectStep === 1) {
          const kind = credentialKind(state.credentialRef);
          const show = state.credentialTouched || state.credentialSubmitted;
          const message = !show ? (state.credentialDirty ? "Edited. Validation runs when you leave the field." : "Use a stored reference such as vault://notes-sync.") : kind === "secret" ? "Worlds stores a credential reference, never the secret." : kind === "valid" ? "Credential reference accepted for the safe test." : kind === "empty" ? "Enter a credential reference." : "Use a reference beginning credential://, vault://, keyring://, or ref://.";
          return `<div class="field"><label for="credential-reference">Credential reference</label><input id="credential-reference" type="text" autocomplete="off" value="${esc(state.credentialRef)}" aria-invalid="${show && kind !== "valid"}" aria-describedby="credential-help credential-status"><span id="credential-help" class="helper">Reference only. Do not paste a token, password, or secret.</span><span id="credential-status" class="validation ${show ? kind === "valid" ? "good" : "error" : ""}" role="status">${message}${state.credentialSubmitted && kind !== "valid" ? " Submitted, pending correction." : ""}</span></div>`;
        }
        if (state.connectStep === 2) {
          const copy = state.testStatus === "idle" ? "Ready to verify reachability without writing or publishing." : state.testStatus === "running" ? "Running a synthetic read-only check..." : state.testStatus === "failed" ? "Safe test failed: provider timed out. Local notes remain available. Retry the check." : "Safe test passed for the mock reference. No provider call occurred.";
          return `<div class="test-status" aria-live="polite"><h3>${state.testStatus === "passed" ? "Passed" : state.testStatus === "failed" ? "Failed" : state.testStatus === "running" ? "Running" : "Run safe test"}</h3><p>${copy}</p>${state.testStatus === "running" ? `<div class="busy-bar" aria-hidden="true"></div>` : ""}<div class="action-row"><button id="run-safe-test" ${state.testStatus === "running" ? "disabled" : ""}>${state.testStatus === "failed" ? "Retry safe test" : "Run safe test"}</button></div></div>`;
        }
        if (state.connectStep === 3) return `<div><h3>Facts found</h3><p class="step-copy">Provider failure and local data remain separate records.</p><div class="fact-list">${store.services["notes-sync"].facts.map(factTemplate).join("")}</div></div>`;
        if (state.connectStep === 4) return `<div><h3>Choose shared facts</h3><p class="step-copy">Selected facts will appear on Home, in the Notes Sync bay, and in Agent facts. The owning app keeps authority.</p><div class="choice-list">${store.services["notes-sync"].facts.map(f => `<div class="choice"><input type="checkbox" id="publish-${f.id}" data-publish-fact="${f.id}" ${state.publishFacts.has(f.id) ? "checked" : ""}><label for="publish-${f.id}"><strong>${f.label}</strong><br><span class="meta">${f.id} - ${f.state}</span></label></div>`).join("")}</div></div>`;
        return `<div><h3>Ready to publish</h3><p class="step-copy">Create the Notes Sync bay with ${state.publishFacts.size} selected fact records. This changes only the mock in-memory store.</p><div class="test-status"><strong>Owner remains Memory</strong><p>Provider retries hand off to the Memory app.</p></div></div>`;
      }
      function connectActions() {
        const back = state.connectStep > 0 ? `<button data-connect-back>Back</button>` : `<button data-nav="home">Cancel</button>`;
        let next = `<button class="primary" data-connect-next>Continue</button>`;
        if (state.connectStep === 2) next = `<button class="primary" data-connect-next ${state.testStatus !== "passed" ? "disabled" : ""}>Continue</button>`;
        if (state.connectStep === 5) next = `<button class="primary" data-publish>Publish service</button>`;
        return `<div class="connect-actions">${back}${next}</div>`;
      }

      function render(options = {}) {
        let content = state.view === "home" ? homeView() : state.view === "connect" ? connectView() : state.view === "memory" ? memoryView() : settingsView();
        app.innerHTML = shell(content);
        bindEvents();
        if (options.focusDetail) document.querySelector("#detail-heading")?.focus();
        if (options.focusBay && state.lastInvokingBay) document.querySelector(`[data-service="${state.lastInvokingBay}"]`)?.focus();
        if (options.focusMain) document.querySelector("#main-content")?.focus();
      }

      function bindEvents() {
        document.querySelectorAll("[data-nav]").forEach(el => el.addEventListener("click", () => {
          state.view = el.dataset.nav;
          if (state.view === "connect") { state.connectStep = 0; state.testStatus = "idle"; }
          render();
        }));
        document.querySelector("#add-service")?.addEventListener("click", () => { state.view = "connect"; state.connectStep = 0; render(); });
        document.querySelectorAll("[data-service]").forEach(el => el.addEventListener("click", () => {
          state.lastInvokingBay = el.dataset.service;
          state.selected = el.dataset.service;
          state.mobileDetail = true;
          state.handoffMessage = "";
          render({focusDetail:true});
        }));
        document.querySelector("[data-back-register]")?.addEventListener("click", () => { state.mobileDetail = false; render({focusBay:true}); });
        document.querySelector("#disconnect")?.addEventListener("click", disconnectSelected);
        document.querySelector("#simulate-change")?.addEventListener("click", simulateChange);
        document.querySelector("[data-owner-action]")?.addEventListener("click", () => {
          state.handoffMessage = "Handed off to Memory. Provider checks belong to the owning app; no retry ran in Worlds.";
          render();
          showToast(state.handoffMessage);
        });
        const credential = document.querySelector("#credential-reference");
        credential?.addEventListener("input", e => { state.credentialRef = e.target.value; state.credentialDirty = true; });
        credential?.addEventListener("blur", e => { state.credentialRef = e.target.value; state.credentialTouched = true; render(); });
        document.querySelector("[data-connect-back]")?.addEventListener("click", () => { state.connectStep = Math.max(0, state.connectStep - 1); render(); });
        document.querySelector("[data-connect-next]")?.addEventListener("click", nextConnectStep);
        document.querySelector("#run-safe-test")?.addEventListener("click", runSafeTest);
        document.querySelectorAll("[data-publish-fact]").forEach(el => el.addEventListener("change", () => { el.checked ? state.publishFacts.add(el.dataset.publishFact) : state.publishFacts.delete(el.dataset.publishFact); }));
        document.querySelector("[data-publish]")?.addEventListener("click", publishNotes);
      }

      function nextConnectStep() {
        if (state.connectStep === 1) {
          state.credentialSubmitted = true;
          state.credentialTouched = true;
          if (credentialKind(state.credentialRef) !== "valid") { render(); document.querySelector("#credential-reference")?.focus(); return; }
        }
        state.connectStep = Math.min(5, state.connectStep + 1);
        render();
      }
      function runSafeTest() {
        state.testStatus = "running";
        render();
        window.setTimeout(() => {
          state.testStatus = state.testFailedOnce ? "passed" : "failed";
          state.testFailedOnce = true;
          render();
          document.querySelector("#run-safe-test")?.focus();
        }, 700);
      }
      function publishNotes() {
        if (!state.publishFacts.size) { showToast("Choose at least one fact to publish."); return; }
        store.services["notes-sync"].facts = serviceFixture["notes-sync"].facts.filter(f => state.publishFacts.has(f.id)).map(f => JSON.parse(JSON.stringify(f)));
        if (!state.connected.includes("notes-sync")) state.connected.push("notes-sync");
        state.selected = "notes-sync";
        state.view = "home";
        state.mobileDetail = true;
        render({focusDetail:true});
        showToast("Notes Sync published. Its selected facts now appear across Worlds.");
      }
      function simulateChange() {
        const front = store.services["front-door"];
        const target = front.facts.find(f => f.id === "frontdoor.back-door");
        target.value = "locked";
        target.observedAt = "Mock review just recorded";
        front.state = "healthy";
        front.stateLabel = "Healthy";
        front.summary = "Back door is shown as locked after the mock review handoff.";
        state.attentionCount = 0;
        state.handoffMessage = "Mock review recorded in Project Home. Worlds did not lock the door.";
        render();
        showToast("Project Home handoff recorded. Home, Front Door, and Agent facts now read locked.");
      }
      function disconnectSelected() {
        const service = store.services[state.selected];
        if (!service) return;
        if (!window.confirm(`Disconnect ${service.name}? Its bay and embedded app will be removed.`)) return;
        state.connected = state.connected.filter(id => id !== service.id);
        state.disconnectedMessage = `${service.name} disconnected. Its bay, embedded app, and current shared facts are gone. Historical retention is UNKNOWN.`;
        if (service.id === "front-door") state.attentionCount = 0;
        state.selected = state.connected[0] || null;
        state.mobileDetail = false;
        state.handoffMessage = "";
        render();
        showToast(state.disconnectedMessage);
      }

      render();
    })();
  </script>
</body>
</html>
