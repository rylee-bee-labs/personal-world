.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);min-height:var(--wv-target-min);padding:.5rem var(--space-md);border:var(--wv-hairline) solid var(--border-line-strong);border-radius:var(--radius-full);background:var(--surface-raised);color:var(--text-primary);font-size:var(--type-label);font-weight:600;letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:background var(--wv-dur-state) var(--wv-ease),border-color var(--wv-dur-state) var(--wv-ease),color var(--wv-dur-state) var(--wv-ease)}

.link{color:var(--text-primary);text-decoration:underline;text-underline-offset:.2rem;text-decoration-thickness:.1rem}

/* shell */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:var(--space-md);min-height:var(--wv-top-h);padding:var(--space-sm) var(--space-lg);background:var(--surface-raised);border-bottom:var(--wv-hairline) solid var(--border-line)}
.brand{display:flex;align-items:center;gap:var(--space-md);margin-right:auto}

.controls{display:flex;gap:var(--space-sm);flex-wrap:wrap;align-items:center;justify-content:flex-end}

#hdr-settings{display:none}
.app{display:grid;grid-template-columns:var(--wv-rail-w) minmax(0,1fr);min-height:calc(100dvh - var(--wv-top-h))}
.rail{background:var(--surface-sunken);border-right:var(--wv-hairline) solid var(--border-line)}
.rail-in{position:sticky;top:var(--wv-top-h);height:calc(100dvh - var(--wv-top-h));padding:var(--space-lg) var(--space-md);display:flex;flex-direction:column;gap:var(--space-xs);overflow:auto}

.nav-item{position:relative;display:flex;align-items:center;gap:.75rem;min-height:var(--wv-target-min);padding:.5rem .75rem;border-radius:var(--radius-md);color:var(--text-primary);text-decoration:none;border:var(--wv-hairline) solid transparent;font-weight:600;background:transparent}
.nav-item svg{width:1.4rem;height:1.4rem;flex:none}
.nav-item:hover{background:var(--surface-raised);border-color:var(--border-line)}
.nav-item[aria-current="page"]{background:var(--surface-raised);border-color:var(--action-primary);font-weight:700}
.badge{min-width:1.5rem;height:1.5rem;padding:0 .4rem;border-radius:var(--radius-full);background:var(--status-needs-you);color:var(--surface-base);font-size:var(--type-small);font-weight:700;display:inline-grid;place-items:center;margin-left:auto}
.tabbar,.fab-slot{display:none}
.main{padding:var(--space-xl);width:100%;max-width:92rem;margin:0 auto;min-width:0}

/* chips, dot, stamp */
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:var(--type-small);font-weight:700}
.chip svg{width:1rem;height:1rem;flex:none}
.c-healthy,.c-live{color:var(--status-healthy)}.c-needs_attention{color:var(--status-needs-you)}.c-stale{color:var(--status-stale)}.c-unavailable{color:var(--status-unavailable)}.c-unknown{color:var(--status-unknown)}.c-not_configured{color:var(--status-not_configured)}.c-done{color:var(--status-done)}.c-failed{color:var(--status-failed)}
.dot{width:3.75rem;height:auto;flex:none}.dot.lg{width:9rem}

.dot .body{fill:var(--accent-mint);stroke:var(--surface-base);stroke-width:1.5}
.dot .ink{fill:none;stroke:var(--surface-base);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot .stalk{fill:none;stroke:var(--accent-mint);stroke-width:3.2;stroke-linecap:round}
.dot .eye{fill:var(--accent-mint)}.dot .pupil{fill:var(--surface-base)}
.dot .paper{fill:var(--surface-raised);stroke:var(--border-line-strong);stroke-width:1.5}

.lane{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);padding:var(--space-md);background:var(--surface-sunken);border-radius:var(--radius-lg);overflow:hidden}

.lane-end{border:var(--wv-frame-line) dashed var(--border-line-strong);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--text-soft)}
@keyframes carry{from{transform:translateX(var(--wv-travel));opacity:0}to{transform:none;opacity:1}}
@keyframes land{from{transform:rotate(-4deg) scale(1.35);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
@keyframes nod{0%,100%{transform:none}50%{transform:rotate(-9deg) translateY(.15rem)}}

@keyframes tick{from{opacity:0}to{opacity:1}}

/* welcome + empty */
.welcome{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(14rem,.7fr);gap:var(--space-xl);padding:var(--space-2xl);background:var(--surface-raised);border:var(--wv-frame-line) solid var(--border-line-strong);border-radius:var(--radius-lg)}
.welcome p{max-width:55ch}
.welcome-dot{display:grid;place-items:center;align-content:center;gap:var(--space-md);background:var(--surface-sunken);border-radius:var(--radius-lg);min-height:15rem;padding:var(--space-lg)}
.empty{display:grid;grid-template-columns:auto 1fr;gap:var(--space-xl);align-items:center;padding:var(--space-xl);border:var(--wv-frame-line) dashed var(--border-line-strong);border-radius:var(--radius-lg);color:var(--text-soft)}
.empty h2{color:var(--text-primary)}
.sel-strip{display:flex;gap:var(--space-md);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-lg)}
.sel-card{display:none}
.checks{display:grid;gap:var(--space-sm);border:0;padding:0;margin:var(--space-md) 0}
.checks legend{font-weight:700;padding:0;margin-bottom:var(--space-sm)}
.check{display:flex;gap:var(--space-md);align-items:flex-start;min-height:var(--wv-target-min);padding:.6rem var(--space-md);background:var(--surface-sunken);border-radius:var(--radius-md);cursor:pointer}

.home-grid{display:grid;grid-template-columns:minmax(16rem,var(--wv-slips-w)) minmax(0,1fr);gap:var(--space-xl);align-items:start}

/* ---------- formatting ---------- */
const shortAge=n=>n<60?n+'s':n<3600?Math.floor(n/60)+'m':Math.floor(n/3600)+'h';
const ageTxt=t=>t==null?'Never checked':shortAge(Math.max(0,Math.round((st.now-t)/1000)))+' ago';
const fmtVal=(v,u)=>(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v)?fmtDT(Date.parse(v)):typeof v==='number'?v.toLocaleString('en-US'):v)+(u?' '+u:'');

const freshest=()=>{const ts=st.connected.map(id=>svcs[id].checkedAt).filter(x=>x!=null);return ts.length?Math.max(...ts):null};
const tsOf=k=>{if(k==='top')return freshest();const[t,a,b]=k.split('|');if(t==='s')return svcs[a]&&svcs[a].checkedAt;if(t==='f'){const f=svcs[a]&&svcs[a].facts.find(x=>x.id===b);return f&&f.obs}if(t==='t')return st.cx.test.at;return null};
const ageSpan=k=>`<span data-ak="${esc(k)}">${ageTxt(tsOf(k))}</span>`;

 return `<svg class="dot ${cls}" viewBox="0 0 112 92" aria-hidden="true" focusable="false"><g transform="translate(0 14)"><path class="body" d="M8 62c0-7 7-11 18-11h50c10 0 18 3 20 9 1 4-1 7-6 7H14c-4 0-6-2-6-5Z"/><circle class="shell" cx="44" cy="38" r="24"/><path class="ink" d="M44 38c0-4 4-6 7-4s3 8-2 10-11-1-12-8 5-13 12-13 14 6 14 14"/><path class="ink" d="M90 62q3 2 6 0"/>${eyes}</g>${parcel?'<rect class="paper" x="26" y="2" width="36" height="22" rx="3"/><path class="ribbon" d="M44 2v22M26 13h36M44 2c-5-5-9-2-6 1M44 2c5-5 9-2 6 1"/>':''}${asleep?'<text class="zz" x="94" y="26">z</text><text class="zz" x="104" y="14" style="font-size:10px">z</text>':''}</svg>`;
}

/* ---------- state helpers ---------- */
function svcState(s){if(s.refused)return['unavailable',false];if(s.state==='healthy'){if(s.facts.some(f=>f.sim==='unknown'))return['unknown',true];if(s.facts.some(f=>f.sim==='stale'))return['stale',true]}return[s.state,false]}
function simAt(s){const f=s.facts.find(x=>x.sim);return f?(f.staleAt||st.now):st.now}
function lines(s,full){
 const[k,sim]=svcState(s),o=[];
 if(s.refused){o.push(`${s.name} stopped accepting this reference. Its last facts are still here, marked with when Worlds checked. Worlds can't fix this on ${s.name}'s side.`);return o}
 if(sim){o.push(k==='stale'?`Nothing has changed since ${fmtT(simAt(s))} that Worlds knows of.`:"Worlds has no current reading for this and won't guess.");return o}
 if(k==='needs_attention'&&s.reason)o.push(s.reason);
 o.push(s.summary);
 if(k==='stale')o.push(`Nothing has changed since ${fmtT(s.checkedAt)} that Worlds knows of.`);
 if(k==='unknown'){if(full&&s.unknownReason)o.push(s.unknownReason);o.push("Worlds has no current reading for this and won't guess.")}
 if(full&&k==='unavailable')o.push(s.id==='studio-printer'?'The printer answered, so Worlds is not treating it as silent.':"That service stopped answering. Its last facts are still here, marked with when Worlds checked.");
 if(k==='not_configured')o.push(`${s.name} isn't set up. Open its settings.`);
 return o;
}
const attn=()=>st.connected.filter(id=>svcs[id].state==='needs_attention').length;

function statusHTML(){
 if(!st.connected.length)return 'No services are connected yet.';
 const n=attn(),a=` · checked ${ageSpan('top')}`;
 if(n)return `<span class="status-word">${n} needs you</span>${a}`;
 return (st.lastOne?'That was the last one. ':'')+'Nothing needs you right now'+(st.lastOne?'.':'')+a;
}
const nod=()=>performance.now()<st.nodUntil,upd=()=>performance.now()<st.updUntil;
const freshLine=()=>`<p class="fresh">${dot('rest',nod()?'nod':'')}<span>${statusHTML()}</span>${upd()?'<strong class="upd">Updated just now</strong>':''}</p>`;
const noteTop=()=>(route()[0]||'home');
function noteHTML(){const n=st.note;if(!n||n.view!==noteTop())return '';return `<div class="note" data-od-id="last-change"><p>${esc(n.text)}</p><div class="actions">${n.reconnect?`<button class="btn" type="button" data-act="reconnect" data-id="${n.reconnect}">Reconnect</button>`:''}${n.owner?ownerLink(svcs[n.owner]):''}<button class="btn text" type="button" data-act="dismiss-note">Dismiss</button></div></div>`}
const pageHead=title=>`<header class="page-head" data-od-id="page-head"><div><h1 tabindex="-1">${title}</h1>${freshLine()}</div><div class="status-slot"></div></header>${noteHTML()}`;
const ownerLink=(s,cls='')=>`<a class="btn ${cls}" href="${esc(s.owner.route)}" data-act="owner" data-fk="owner-${s.id}" data-app="${esc(s.owner.app)}">${esc(s.owner.label)}</a>`;
const permText=(s,f)=>({a:{read:'see it',act:'act on it',none:'not at all'}[f.agent],h:{read:'see it',write:'edit the local copy',act:`act on it in the ${s.owner.app} app`,none:'not at all'}[f.human]});
function permHTML(s,f){const t=permText(s,f);const row=(who,p,txt,reason)=>{if(p==='none'){const id='pr'+(++uid);return `<div class="perm"><button type="button" class="btn perm-none" aria-disabled="true" aria-describedby="${id}">${who} can: ${txt}</button><span class="perm-line muted" id="${id}">${esc(reason||'')}</span></div>`}return `<p class="perm-line"><strong>${who} can:</strong> ${txt}.${reason?` <span class="muted">${esc(reason)}</span>`:''}</p>`};return row('Agent',f.agent,t.a,f.aReason)+row('Human',f.human,t.h,f.hReason)}
const scopeWord=s=>s.scope?`Scoped to ${capN(s.scope.length)}`:'Unscoped';

function factBtn(s,f){return `<li><button type="button" class="fact" data-act="fact" data-s="${s.id}" data-f="${esc(f.id)}" data-fk="fact-${s.id}-${esc(f.id)}" aria-pressed="${selFact(s)===f}">${factInner(f).replace('data-ak="x"',`data-ak="f|${s.id}|${esc(f.id)}"`)}</button></li>`}

/* ---------- receipt ---------- */
function receiptHTML(s,f){
 if(!f)return `<section class="receipt" data-od-id="fact-receipt"><h3>No facts</h3><p>${esc(s.emptyReason||'This service has no facts at the counter.')}</p></section>`;
 const settle=performance.now()<st.settleUntil&&st.settleSvc===s.id;
 const srcW=f.src==='local'?'From this device':f.src==='external'?"From the service's provider":'No source answered';
 let lead;
 if(f.state==='unknown')lead=`No current reading. <strong>Unknown</strong>.${f.lastVal!==undefined?` Last known: ${esc(fmtVal(f.lastVal,f.unit))} at ${fmtT(f.lastAt)}.`:''}`;
 else if(f.state==='stale')lead=`${esc(s.owner.app)} last reported <strong>${esc(fv(f))}</strong> (last known).`;
 else if(f.state==='unavailable')lead=f.value==null?`Nothing came back. <strong>Unavailable</strong>.`:`${esc(s.owner.app)} reported <strong>${esc(fv(f))}</strong> but marked it unavailable.`;
 else lead=`${esc(s.owner.app)} reported <strong>${esc(fv(f))}</strong>.`;
 const tk=svg(GL.check);
 return `<section class="receipt ${settle?'settle':''}" data-od-id="fact-receipt" aria-label="Receipt for ${esc(f.label)}"><div class="receipt-head"><p class="micro muted">Where this fact came from</p><h3>${esc(f.label)}</h3><p class="val">${esc(fv(f))}</p></div>
 <div class="stations">
  <div class="station" style="--i:0"><h3>Source<span class="tk">${tk}</span></h3><p>${lead}</p><span class="st-line">${srcW}</span><span class="st-line">State: ${chip(f.state,f.sim?' (simulated)':'')}</span><span class="st-line">Checked ${f.obs?ageSpan('f|'+s.id+'|'+f.id):'never'}</span>${f.sim?`<div class="actions"><button type="button" class="btn" data-act="check" data-s="${s.id}" data-f="${esc(f.id)}">Check now</button></div>`:''}</div>
  <div class="station" style="--i:1"><h3>Worlds<span class="tk">${tk}</span></h3><p>Shared as <strong>${esc(f.label)}</strong>.</p><span class="st-line">Fact id: <code>${esc(f.id)}</code></span><span class="st-line">${esc(provenance(s))}</span><span class="st-line">${scopeWord(s)}</span></div>
  <div class="station" style="--i:2"><h3>Agent / Human<span class="tk">${tk}</span></h3>${permHTML(s,f)}</div>
 </div></section>`;
}
function seesHTML(s){const a=s.facts.filter(f=>f.agent!=='none'),h=s.facts.filter(f=>f.agent==='none');if(!s.facts.length)return '';return `<p class="sees"><strong>Agent sees:</strong> ${esc(list(a.map(f=>f.label))||'nothing')}.${h.length?` <span class="muted">Agent can't see: ${esc(list(h.map(f=>f.label)))}.</span>`:''}</p>`}
function retryHTML(s){if(!s.retry)return '';return `<div class="retry" data-od-id="owner-retry-${s.id}"><p><strong>${esc(s.retry.label)}</strong>, tried ${pl(s.retry.attempts,'time')}. Last error: ${esc(s.retry.lastError)}.</p><p class="muted">This happens in ${esc(s.owner.app)}, by you. Worlds can't retry it.</p>${ownerLink(s)}</div>`}

/* ---------- app frame ---------- */
const PLAN={'front-door':'refused','notes-sync':'timeout'};
function ensureFrame(id){if(st.frames[id])return;st.frames[id]={state:'loading',tries:0};loadFrame(id)}
function loadFrame(id){const fr=st.frames[id];fr.state='loading';fr.tries++;paintFrame(id);clearTimeout(fr.t);fr.t=setTimeout(()=>{if(fr.state!=='loading')return;fr.state=fr.tries===1&&PLAN[id]?PLAN[id]:'loaded';paintFrame(id)},fr.tries===1?900:500)}
function frameInner(s){const fr=st.frames[s.id]||{state:'loading'};const w={loading:'Loading',loaded:'Loaded',refused:'Not shown',timeout:'Not shown',cancelled:'Not shown'}[fr.state];let body='',ctl='';
 if(fr.state==='loading'){body=`<div class="frame-body" style="display:flex;gap:1rem;align-items:center">${dot('rest')}<p>Dot is fetching the app…</p></div>`;ctl=`<button type="button" class="btn" data-act="frame-cancel" data-id="${s.id}">Cancel</button>`}
 else if(fr.state==='loaded'){body=`<div class="frame-body"><div class="mini-app" role="group" aria-label="Contained preview of the ${esc(s.owner.app)} app"><p class="micro muted">${esc(s.owner.app)} · contained preview</p><p><strong>${esc(s.name)}</strong></p><p class="muted">${esc(s.summary)}</p><ul style="list-style:none">${s.facts.map(f=>`<li>${esc(f.label)}: <strong>${esc(fv(f))}</strong></li>`).join('')}</ul></div></div><p class="frame-foot muted">This app doesn't receive Worlds' credentials.</p>`;ctl=`<button type="button" class="btn" data-act="frame-retry" data-id="${s.id}">Reload</button>`}
 else{const cause=fr.state==='timeout'?'It took too long to answer.':fr.state==='cancelled'?'Loading was cancelled.':"The app doesn't allow being shown inside another page.";body=`<div class="frame-body"><p><strong>This app didn't load inside Worlds.</strong></p><p class="muted">${cause} Use the link below, or try again.</p></div>`;ctl=`<button type="button" class="btn" data-act="frame-retry" data-id="${s.id}">Try again</button>`}
 return `<div class="frame-bar"><strong>${esc(s.owner.app)} app, shown inside Worlds</strong><span class="micro muted">${w}</span></div>${body}<div class="frame-foot actions" style="margin-top:0">${ownerLink(s)}${ctl}</div>`}
function paintFrame(id){const el=document.getElementById('frame-'+id);if(el&&svcs[id].connected)keepFocus(()=>{el.innerHTML=frameInner(svcs[id])})}

/* ---------- views ---------- */
function slipHTML(s){const[k,sim]=svcState(s),f=s.facts[0],sel=s.id===st.selected;const peek=f?`<span>${esc(f.label)}</span><strong>${esc(fv(f))}${f.state==='stale'?' (last known)':''}</strong>`:'<span>No facts</span><strong>None</strong>';
 return `<li><button type="button" class="slip" data-act="slip" data-id="${s.id}" data-fk="slip-${s.id}" aria-pressed="${sel}"><span class="slip-top"><span><span class="slip-name">${esc(s.name)}</span><span class="slip-kind">${esc(s.kind)}</span></span>${chip(k,sim?' (simulated)':'')}</span><span class="slip-reason">${lines(s,false).map(esc).join(' ')}</span><span class="slip-peek">${peek}</span><span class="slip-foot"><span>Checked ${s.checkedAt==null?'never':ageSpan('s|'+s.id)}</span>${sel?`<span class="sel-word">${svg(GL.check)}Selected</span>`:''}</span></button></li>`}
function journeyHTML(){if(st.journeySeen)return '';return `<aside class="journey" data-od-id="fact-journey"><h3>Here's one fact on its way.</h3><p>Media Shelf says it holds 1,284 items. Worlds shows where that came from and who can see it or act on it.</p><div class="mini-stations" aria-hidden="true"><span>Source · Media Shelf, local</span><span>Worlds · Items in library</span><span>Agent / Human</span></div><p class="muted">Every fact says where it came from and who can act on it.</p><button type="button" class="btn" data-act="dismiss-journey">Got it</button></aside>`}
function detailHTML(s,h1){
 ensureFrame(s.id);const[k,sim]=svcState(s),f=selFact(s);const pushed=h1;
 const title=h1?`<h1 class="svc-title" tabindex="-1">${esc(s.name)}</h1>`:`<h2 class="svc-title" tabindex="-1">${esc(s.name)}</h2>`;
 const dis=h1?'<div class="disc-slot"></div>':'';

/* ---------- welcome ---------- */
function viewWelcome(n){
 st.beat=n;const head='';
 if(n===1)return `<section class="welcome" data-od-id="welcome-1"><div class="welcome-copy"><h1 tabindex="-1">Hello, I'm Dot.</h1><p>Worlds is a small counter. Your services leave their facts here, and Worlds keeps them honest.</p><p class="muted">Shall we connect the first one together? Nothing here calls a real network.</p><div class="actions"><button type="button" class="btn primary" data-act="w-next" data-fk="w-next">Connect a service</button><button type="button" class="btn" id="skip-welcome" data-act="skip-welcome">Skip welcome</button></div></div><div class="welcome-dot">${dot('asleep','lg')}<p class="muted">Dot is asleep until you are ready.</p></div></section>`;

 else if(w==='delivering'){side=`<div class="welcome-dot"><div class="lane" style="width:100%">${dot('parcel')}<span class="lane-end">Counter</span></div><p>Dot is carrying the parcel to the counter…</p></div>`;act=''}
 else{side=`<div class="welcome-dot"><span class="stamp">${svg(GL.check)}Connected</span>${dot('rest','lg')}<p><strong>${esc(s.name)} is at the counter.</strong></p></div>`;act=`<button type="button" class="btn primary" data-act="w-continue" data-fk="w-continue" id="w-continue">${n===2?'Next: Front Door':'See your counter'}</button>`}
 return `<section class="welcome" data-od-id="welcome-${n}"><div class="welcome-copy"><h1 tabindex="-1">${heading}</h1><p class="muted">${esc(s.kind)} · owned by the ${esc(s.owner.app)} app</p><fieldset class="checks" ${w!=='idle'?'disabled':''}><legend>Worlds will send this reference only when reading: ${esc(list([...sc]))}.</legend>${capsHTML}</fieldset><p>${chip('done')} Passed. Nothing on ${esc(s.name)} was changed.</p><p class="micro muted">The reference is <code>ref://${id}</code>, a mock handle. No real network is called.</p><div class="actions">${act}${w==='idle'&&n===3?'<button type="button" class="btn" data-act="w-back">Back</button>':''}${w==='idle'&&n===2?'<button type="button" class="btn" data-act="w-back">Back</button>':''}<button type="button" class="btn text" id="skip-welcome" data-act="skip-welcome">Skip welcome</button></div></div>${side}</section>`;

/* ---------- connect ---------- */
const STEPS=['discover','reference','test','preview','choose','publish'],SN=['Discover','Reference','Test','Preview','Choose','Publish'];
const refCheck=v=>{v=(v||'').trim();if(!v)return'empty';const m=/^ref:\/\/([A-Za-z0-9][A-Za-z0-9_-]{0,48})$/.exec(v);if(!m)return'secret';if(/^(PW_|OIDC_)/i.test(m[1])||/BOOTSTRAP/i.test(m[1]))return'own';return'valid'};
const REFMSG={pristine:['','Not edited yet. Use the form ref://name.'],dirty:['','Edited. Worlds checks it when you leave the field.'],valid:['done','Looks like a reference.'],secret:['failed',"That looks like a secret, not a reference. Nothing was saved and the field was cleared. Worlds stores a credential reference, never the secret. Use something like ref://notes-sync."],own:['failed',"That reference points at one of Worlds' own secrets, so it can't be used for a service."],pending:['','Saving reference…']};
const msgHTML=k=>{const[c,t]=REFMSG[k];return `${c==='done'?svg(GL.check,'c-done'):c==='failed'?svg(GL.x,'c-failed'):''}<span class="${c?'c-'+c:''}">${t}</span>`};
function cxGuard(step){const c=st.cx,i=STEPS.indexOf(step);if(i<0)return'discover';if(i>=1&&!c.sid)return'discover';if(i>=2&&!(c.refState==='valid'&&c.scope.size))return'reference';if(i>=3&&c.test.state!=='passed')return'test';if(i>=5&&!c.chosen.size)return'choose';return step}
function pick(id){const c=st.cx,keep=c.mode;Object.assign(c,newCx(),{mode:keep==='narrow'?'narrow':'new',sid:id,scope:new Set(caps(id)),chosen:new Set(DEFS[id].facts().map(f=>f.id))})}
function cxBar(step){const c=st.cx,i=STEPS.indexOf(step);let next='';
 if(step==='publish'){if(c.phase==='delivering')return '';if(c.phase==='done')return ''}
 const dis=(step==='discover'&&!c.sid)||(step==='reference'&&!(c.refState==='valid'&&c.scope.size))||(step==='test'&&c.test.state!=='passed')||(step==='preview'&&!c.ready)||(step==='choose'&&!c.chosen.size);
 const label=step==='publish'?'Publish':step==='reference'&&c.mode==='narrow'?'Save narrower scope':step==='reference'&&c.mode==='replace'?'Save reference':'Next';
 next=`<button type="button" class="btn primary" id="cx-next" data-act="cx-next" ${dis?'aria-disabled="true"':''}>${label}</button>`;
 return `<div class="cx-bar" data-od-id="connect-bar"><button type="button" class="btn text" data-act="cx-cancel">Cancel</button><span style="flex:1"></span>${i>0&&!(c.mode==='replace'&&step==='reference')?'<button type="button" class="btn" data-act="cx-back">Back</button>':''}${next}</div>`}
function viewConnect(step){
 const c=st.cx,i=STEPS.indexOf(step),s=c.sid?svcs[c.sid]:null;let body='';
 const refreshStep=`<p class="step-line">Step ${i+1} of 6 · ${SN[i]}</p>`;
 if(step==='discover'){
  const cands=c.mode==='narrow'?[c.sid]:CANDS.filter(id=>!svcs[id].connected),here=st.connected;
  if(!c.sid&&cands.length)pick(cands[0]);
  body=`<h1 tabindex="-1">Find a service</h1><p class="says">Looking only. No reference has been used yet. This sends no credential and changes nothing.</p>${cands.length?`<fieldset class="checks" style="border:0;padding:0"><legend>Services Worlds could connect</legend>${cands.map(id=>{const d=svcs[id];return `<label class="cand"><input type="radio" name="cand" value="${id}" data-chg="cx-pick" ${c.sid===id?'checked':''}><span><strong class="slip-name">${esc(d.name)}</strong><br><span class="micro muted">${esc(d.kind)} · reported by the ${esc(d.owner.app)} app</span><br><span class="micro">Not connected yet · no reading</span> · <span class="micro">Auth: unknown</span><ul>${caps(id).map(x=>`<li>${esc(x)} · not verified yet</li>`).join('')}</ul></span></label>`}).join('')}</fieldset>`:'<p class="empty">No other services to connect right now.</p>'}${here.length&&c.mode!=='narrow'?`<h2 class="sec-title" style="font-size:var(--type-h1)">Already at the counter</h2><p class="muted">${esc(list(here.map(id=>svcs[id].name)))}</p>`:''}`;
 }else if(step==='reference'){
  const pend=c.refState==='pending';
  body=`<h1 tabindex="-1">Credential reference</h1><p class="says">A reference is a name that points to a secret kept somewhere safe. Worlds stores the name, never the secret.</p><div class="field"><label for="cx-ref"><strong>Reference for ${esc(s.name)}</strong></label><input type="text" id="cx-ref" data-fk="cx-ref" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ref://${esc(s.id)}" value="${esc(c.ref)}" aria-describedby="ref-msg" ${c.refState==='secret'||c.refState==='own'?'aria-invalid="true"':''} ${pend?'readonly':''}><p class="msg" id="ref-msg" aria-live="polite">${msgHTML(c.refState)}</p></div>
  <fieldset class="checks"><legend>What this reference may be used for</legend>${caps(s.id).map(x=>`<label class="check"><input type="checkbox" data-chg="cx-cap" data-c="${esc(x)}" ${c.scope.has(x)?'checked':''}><span>${esc(x)}</span></label>`).join('')}</fieldset>
  <p id="scope-sentence"><strong>${c.scope.size?`Worlds will send this reference only when reading: ${esc(list([...c.scope]))}.`:'Tick at least one thing this reference may be used for.'}</strong></p><p class="muted">This is about what the reference can be used for. It is not what appears on your counter.</p>`;
 }else if(step==='test'){
  const t=c.test;let res='';
  if(t.state==='running')res=`<div class="panel" style="display:flex;gap:1rem;align-items:center">${dot('rest')}<p>Testing…</p></div>`;
  else if(t.state==='passed')res=`<div class="panel"><p>${chip('done')} <strong>Passed. Worlds read ${DEFS[s.id].facts().length} facts in ${180+s.name.length*7}ms (simulated). Nothing on ${esc(s.name)} was changed.</strong></p></div>`;
  else if(t.state==='failed'||t.state==='limit')res=`<div class="panel"><p>${chip('failed')} <strong>That didn't go through, and the reference is still here. Try again whenever you like.</strong></p><p class="muted">Cause: provider timed out · last tried ${ageSpan('t|')} · try ${t.n} of 3</p>${t.state==='limit'?"<p>That's three tries. Check the reference with the owning app, then edit it to start again.</p>":''}</div>`;
  const dis=t.state==='running'||t.state==='limit';
  body=`<h1 tabindex="-1">Run a safe test</h1><p class="says">One read. Nothing on ${esc(s.name)} changes. The reference is sent only within the scope you set: ${esc(list([...c.scope]))}.</p><label class="check"><input type="checkbox" data-chg="cx-sim" ${c.simFail?'checked':''}><span>Simulate a failed test (mock)</span></label><div class="actions"><button type="button" class="btn ${t.state==='passed'?'':'primary'}" id="cx-run" data-act="cx-run" ${dis?'aria-disabled="true"':''}>${t.state==='failed'?'Try again':'Run safe test'}</button></div><div aria-live="polite">${res}</div>`;
 }else if(step==='preview'){
  body=`<h1 tabindex="-1">What ${esc(s.name)} offers</h1>`+(c.ready?`<p class="says">These are separate facts and stay separate. Capabilities now read verified.</p>${DEFS[s.id].facts().length?DEFS[s.id].facts().map(f=>`<div class="pre-fact"><span><strong>${esc(f.label)}</strong><br><span class="micro muted">${esc(caps(s.id).includes(f.label)?'verified':'')}</span></span><span style="text-align:right"><strong>${esc(fv(f))}</strong><br>${chip(f.state)}</span></div>`).join(''):'<p class="empty">This service offers no facts yet. Nothing is guessed.</p>'}`:`<div class="panel" style="display:flex;gap:1rem;align-items:center">${dot('rest')}<div><p>Dot is fetching the facts…</p><p class="micro muted">If this stalls, ${ownerLink(s,'text')}</p></div></div>`);
 }else if(step==='choose'){
  const fl=DEFS[s.id].facts(),last=c.chosen.size===1;
  body=`<h1 tabindex="-1">Choose what to show</h1><p class="says">Shown on your counter and visible to agents: ${esc(list(fl.filter(f=>c.chosen.has(f.id)).map(f=>f.label))||'nothing')}.</p><fieldset class="checks"><legend>Facts to publish</legend>${fl.map(f=>{const lock=last&&c.chosen.has(f.id);return `<label class="check" ${lock?'aria-disabled="true"':''}><input type="checkbox" data-chg="cx-fact" data-f="${esc(f.id)}" ${c.chosen.has(f.id)?'checked':''} ${lock?'aria-disabled="true"':''}><span><strong>${esc(f.label)}</strong><br><span class="micro muted">${esc(fv(f))} · ${SW[f.state][1]}${lock?' · At least one fact must stay shared.':''}</span></span></label>`}).join('')}</fieldset><p class="muted">At least one fact must stay shared.</p>`;
 }else{
  const fl=DEFS[s.id].facts(),shown=fl.filter(f=>c.chosen.has(f.id)),out=fl.filter(f=>!c.chosen.has(f.id));
  let tail='';
  if(c.phase==='delivering')tail=`<div class="lane">${dot('parcel')}<span class="lane-end">Counter</span></div><p>Dot is carrying the parcel to the counter…</p>`;
  else if(c.phase==='done')tail=`<div class="panel" style="display:grid;gap:1rem;justify-items:start"><span class="stamp">${svg(GL.check)}Connected</span><div style="display:flex;gap:1rem;align-items:center">${dot('rest','lg')}<p><strong>${esc(s.name)} is at the counter.</strong></p></div><div class="actions" style="margin:0"><button type="button" class="btn primary" id="cx-open" data-act="cx-open">Open ${esc(s.name)}</button><button type="button" class="btn" data-act="cx-more">Add one more</button><a class="btn text" href="#/settings/references">Manage this reference in Settings</a></div></div>`;
  body=`<h1 tabindex="-1">${c.phase==='done'?'Connected':'Publish '+esc(s.name)}</h1><p class="says">Publishing adds ${esc(s.name)} and its chosen facts to the counter.</p><ul style="list-style:none;display:grid;gap:.5rem"><li><strong>Reference:</strong> <code>${esc(c.ref)}</code>, ${capN(c.scope.size)}</li><li><strong>Shown:</strong> ${esc(list(shown.map(f=>f.label)))}</li>${out.length?`<li><strong>Kept out:</strong> ${esc(list(out.map(f=>f.label)))}</li>`:''}</ul>${tail}`;
 }
 const aside=`<aside class="cx-aside" aria-label="What will happen"><h2>What will happen</h2><ul><li>Service: ${s?esc(s.name):'not chosen yet'}</li><li>Reference: ${c.refState==='valid'?'looks like a reference':'not set'}</li><li>Reference may be used for: ${c.scope.size?capN(c.scope.size):'not set'}</li><li>Test: ${c.test.state==='passed'?'passed':'not run'}</li><li>Facts to show: ${c.chosen.size||'not chosen'}</li></ul><p>Nothing is saved until Publish. No real network is called in this mockup.</p></aside>`;
 const steps=`<ol class="steps" aria-label="Connect steps">${SN.map((n,k)=>`<li class="${k<i?'done':''}" ${k===i?'aria-current="step"':''}><span class="num">${k<i?svg(GL.check):k+1}</span><span>${n}${k<i?'<span class="sr-only"> (done)</span>':''}</span></li>`).join('')}</ol>`;
 return `<div class="cx" data-od-id="connect">${steps}<section class="cx-body" aria-label="${SN[i]}">${refreshStep}${body}${cxBar(step)}</section>${aside}</div>`;
}

/* ---------- settings ---------- */
function viewSettings(r){
 const refs=ORDER.map(id=>svcs[id]).filter(s=>s.ref),sec=r[1]||'services';

/* ---------- connection logic ---------- */
function resetSvc(id){Object.assign(svcs[id],mkBase(id))}
function applyLock(s){const b=s.facts.find(f=>f.id==='frontdoor.back-door'),u=s.facts.find(f=>f.id==='frontdoor.unlocked-for');if(b){b.value='locked';b.obs=st.now}if(u){u.value=0;u.obs=st.now;u.sim='sim'}s.state='healthy';s.reason=null;s.summary='Back door is locked. The Home app remains the owner.';s.checkedAt=st.now}
function connectSvc(id,o){
 resetSvc(id);const s=svcs[id];
 s.connected=true;s.ref=o.ref;s.heldRef=false;s.scope=o.scope?[...o.scope]:null;s.during=o.during;s.connectedAt=st.now;s.keptOut=o.omit||[];
 s.facts=s.facts.filter(f=>!s.keptOut.includes(f.id));
 s.facts.forEach(f=>{f.nextChk=st.now+30000});
 if(id==='front-door'&&st.doorLocked)applyLock(s);
 if(!st.connected.includes(id))st.connected.push(id);
 st.selected=id;st.fact[id]=s.facts[0]&&s.facts[0].id;delete st.frames[id];st.lastOne=false;
 const f=s.facts.find(x=>x.state==='live');
 if(f&&!st.scripted.has(f.id)){
  if(id==='media-shelf'&&!st.scripted.has('media.items')){const m=s.facts.find(x=>x.id==='media.items');if(m){st.scripted.add(m.id);m.script={since:st.now,stage:0}}}
  else if(o.via==='connect'&&!st.armConn&&id!=='media-shelf'){st.armConn=true;st.scripted.add(f.id);f.script={since:st.now,stage:0}}
 }
}
function toStale(f,s){f.state='stale';f.sim='stale';f.staleAt=st.now;f.script=f.script||{since:st.now};f.script.stage=1;f.script.at=st.now}
function toUnknown(f){f.lastVal=f.value;f.lastAt=f.obs;f.value=null;f.state='unknown';f.sim='unknown';f.script.stage=2}
function stepFacts(){let changed=null;
 for(const id of st.connected){const s=svcs[id];for(const f of s.facts){
  const sc=f.script;
  if(sc&&sc.stage===0&&f.state==='live'&&st.now-sc.since>=90000){toStale(f,s);changed=`${s.name} is now Stale.`;continue}
  if(sc&&sc.stage===1&&f.state==='stale'&&st.now-sc.at>=60000){toUnknown(f);changed=`${s.name} is now Unknown.`;continue}
  if(f.state==='live'&&s.state!=='needs_attention'&&!s.refused&&f.nextChk&&st.now>=f.nextChk){f.obs=st.now;f.nextChk+=30000;if(s.state==='healthy')s.checkedAt=st.now}
 }}
 return changed}
function tick(){
 if(!st.welcomeDone||!st.live||st.offline)return;
 st.now+=1000;st.sec++;const ch=stepFacts();
 if(ch){st.settleUntil=performance.now()+1500;say(ch+' (simulated)');refreshAll()}
 else if(st.sec%st.cadence===0){refreshAges();updateTop()}
}
setInterval(tick,1000);
function toggleLive(){st.live=!st.live;updateTop();say(st.live?'Live feed resumed.':'Live feed paused. Freshness is frozen.',{keep:!st.live})}
function simulate(){
 const s=svcs['front-door'];
 if(!s.connected){say("Front Door isn't at the counter, so there is nothing for the Home app to update.");return}
 if(st.doorLocked){say('The Home app already reported the back door locked.');return}
 st.doorLocked=true;applyLock(s);st.lastOne=attn()===0;
 st.nodUntil=performance.now()+1000;st.updUntil=performance.now()+3000;st.settleUntil=performance.now()+1500;st.settleSvc='front-door';
 say('Updated across Home, Front Door and Agent facts. The Home app reported the back door locked. Worlds locked nothing.');
 refreshAll();clearTimeout(simulate.t);simulate.t=setTimeout(()=>{if(!$('#dlg').open&&route()[0]!=='connect'&&route()[0]!=='welcome')refreshAll()},3100);
}

/* ---------- connect actions ---------- */
function startPreview(){const c=st.cx;clearTimeout(startPreview.t);startPreview.t=setTimeout(()=>{c.ready=true;if(routeKey()==='connect/preview')keepFocus(()=>renderView({}))},800)}
function cxSetRef(v){const c=st.cx;c.ref=v;c.test={n:0,state:'idle',at:null};c.refState=v.trim()?'dirty':'pristine';updateRefUI()}
function updateRefUI(){const c=st.cx,m=$('#ref-msg'),i=$('#cx-ref');if(m)m.innerHTML=msgHTML(c.refState);if(i){if(c.refState==='secret'||c.refState==='own')i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid')}const n=$('#cx-next');if(n){const ok=c.refState==='valid'&&c.scope.size;if(ok)n.removeAttribute('aria-disabled');else n.setAttribute('aria-disabled','true')}}
function cxValidate(){const c=st.cx,k=refCheck(c.ref);if(k==='empty'){c.refState='pristine'}else if(k==='secret'){c.ref='';c.refState='secret';const i=$('#cx-ref');if(i)i.value=''}else if(k==='own')c.refState='own';else c.refState='valid';updateRefUI();return c.refState==='valid'}
function cxNext(){
 const step=route()[1],c=st.cx,i=STEPS.indexOf(step);
 if(step==='reference'){if(!cxValidate()||!c.scope.size){const f=$('#cx-ref');f&&f.focus();return}
  if(c.mode==='narrow'||c.mode==='replace'){const s=svcs[c.sid];s.ref=c.ref;s.scope=[...c.scope];if(c.mode==='replace'){s.refused=false;s.facts.forEach(f=>{if(f.sim==='stale'&&f.script)return;if(f.refStale){f.state='live';f.sim=null;delete f.refStale}});}const to=c.returnTo;say(c.mode==='narrow'?`${s.name}'s reference is now scoped to ${capN(c.scope.size)}.`:`${s.name}'s reference was replaced. Worlds will check it now.`);st.cx=newCx();go(to);return}
  c.refState='pending';updateRefUI();const inp=$('#cx-ref');inp&&inp.setAttribute('readonly','');setTimeout(()=>{c.refState='valid';go('#/connect/test')},600);return}
 if(step==='publish'){publish();return}
 go('#/connect/'+STEPS[i+1]);
}
function runTest(){const c=st.cx,t=c.test;if(t.state==='running'||t.state==='limit'||refCheck(c.ref)!=='valid'||!c.scope.size)return;t.state='running';keepFocus(()=>renderView({}));
 setTimeout(()=>{t.at=st.now;if(c.simFail){t.n++;t.state=t.n>=3?'limit':'failed';say("Test didn't pass.",{loud:true})}else{t.state='passed';t.n=0}if(routeKey()==='connect/test'){renderView({});const el=t.state==='passed'?$('#cx-next'):$('#cx-run');el&&el.focus()}},900)}
function publish(){const c=st.cx,s=svcs[c.sid];if(c.phase!=='confirm')return;
 const omit=DEFS[c.sid].facts().filter(f=>!c.chosen.has(f.id)).map(f=>f.id);
 connectSvc(c.sid,{ref:c.ref,scope:c.scope,during:'connect',omit,via:'connect'});c.phase='delivering';renderNav();renderView({focus:true});updateTop();
 const dur=matchMedia('(prefers-reduced-motion:reduce)').matches||st.motion==='reduce'?0:isPhone()?300:400;
 setTimeout(()=>{c.phase='done';if(routeKey()==='connect/publish'){renderView({focus:true});const o=$('#cx-open');o&&o.focus()}say(`Connected ${s.name}. Its slip and facts are now at the counter.`)},dur+60)}

/* ---------- actions ---------- */
function startConnectWith(id,mode,ref,to){st.cx=newCx();const c=st.cx,s=svcs[id];Object.assign(c,{mode,sid:id,ref:ref||'',refState:ref?'valid':'pristine',scope:new Set(s.scope||caps(id)),chosen:new Set(DEFS[id].facts().map(f=>f.id)),returnTo:to||'#/home'});}
const ACT={
 live:toggleLive,simulate,
 add(){if(!st.welcomeDone){st.welcomeDone=true;st.replay=false}st.cx=newCx();go('#/connect/discover')},
 disconnect(){const s=selSvc();if(s)openDisconnect(s.id)},
 'disc-row'(t){openDisconnect(t.dataset.id)},
 slip(t){st.selected=t.dataset.id;st.tab='facts';if(isPhone())go('#/home/'+t.dataset.id);else{history.replaceState(null,'','#/home/'+t.dataset.id);renderView({});updateTop()}},
 'open-svc'(t){go('#/home/'+t.dataset.id)},
 'back-home'(){go('#/home')},
 fact(t){st.fact[t.dataset.s]=t.dataset.f;renderView({})},
 tab(t){st.tab=t.dataset.t;renderView({})},
 owner(t){ownerNote(t.dataset.app)},
 'frame-retry'(t){loadFrame(t.dataset.id)},
 'frame-cancel'(t){const fr=st.frames[t.dataset.id];clearTimeout(fr.t);fr.state='cancelled';paintFrame(t.dataset.id)},
 check(t){const s=svcs[t.dataset.s],f=s.facts.find(x=>x.id===t.dataset.f);if(!f)return;if(f.lastVal!==undefined){f.value=f.lastVal;delete f.lastVal;delete f.lastAt}f.state='live';f.sim=null;f.obs=st.now;f.nextChk=st.now+30000;f.script=null;st.settleUntil=performance.now()+1500;st.settleSvc=s.id;say(`${f.label} was checked and is Live again.`);refreshAll()},
 handoff,
 'dlg-close'(){$('#dlg').close()},
 'dlg-disc'(t){doDisconnect(t.dataset.id)},
 'dlg-revoke'(t){doRevoke(t.dataset.id)},
 reconnect(t){const id=t.dataset.id,s=svcs[id];st.note=null;startConnectWith(id,'reconnect',s.ref,'#/home');go('#/connect/reference')},
 'dismiss-note'(){st.note=null;renderView({})},
 'dismiss-journey'(){st.journeySeen=true;renderView({})},
 'skip-welcome'(){st.welcomeDone=true;st.replay=false;st.selected=st.selected||st.connected[0]||null;go('#/home')},
 'w-next'(){go('#/welcome/2')},
 'w-back'(){go('#/welcome/'+Math.max(1,st.beat-1))},
 'w-connect'(t){const id=t.dataset.id;if(!st.wscope[id].size)return;st.wstate[id]='delivering';connectSvc(id,{ref:'ref://'+id,scope:st.wscope[id],during:'first run'});renderNav();renderView({focus:true});
   const dur=matchMedia('(prefers-reduced-motion:reduce)').matches||st.motion==='reduce'?0:isPhone()?300:400;setTimeout(()=>{st.wstate[id]='done';renderView({focus:true});const b=$('#w-continue');b&&b.focus()},dur+60)},
 'w-continue'(){if(st.beat===2)go('#/welcome/3');else{st.welcomeDone=true;st.replay=false;go('#/home')}},
 'cx-next':cxNext,'cx-run':runTest,
 'cx-back'(){const i=STEPS.indexOf(route()[1]);go('#/connect/'+STEPS[Math.max(0,i-1)])},
 'cx-cancel'(){const to=st.cx.returnTo;st.cx=newCx();go(st.cx&&to&&to!=='#/home'?to:'#/home')},
 'cx-open'(){const id=st.cx.sid;st.cx=newCx();go('#/home/'+id)},
 'cx-more'(){st.cx=newCx();go('#/connect/discover')},
 'ref-replace'(t){st.replacing=t.dataset.id;renderView({});const i=$('#rep-ref');i&&i.focus()},
 'ref-cancel'(){const id=st.replacing;st.replacing=null;renderView({});const b=findFk('rep-'+id);b&&b.focus()},
 'ref-save'(t){const s=svcs[t.dataset.id],i=$('#rep-ref'),m=$('#rep-msg'),k=refCheck(i.value);
   if(k==='valid'){s.ref=i.value.trim();st.replacing=null;say(`${s.name}'s reference was replaced.`);renderView({})}
   else if(k==='empty'){m.innerHTML=msgHTML('pristine');i.focus()}
   else{if(k==='secret')i.value='';m.innerHTML=msgHTML(k);i.setAttribute('aria-invalid','true');i.focus()}},
 'ref-remove'(t){openRevoke(t.dataset.id)},
 'ref-narrow'(t){const id=t.dataset.id;startConnectWith(id,'narrow',svcs[id].ref,'#/settings/references');go('#/connect/discover')},
 replay(){st.welcomeDone=false;st.replay=true;st.beat=1;st.wstate={};go('#/welcome/1')},
 journey(){st.journeySeen=false;go('#/home')},
 'mock-stale'(){const s=svcs['media-shelf'];const f=s.connected&&s.facts.find(x=>x.id==='media.items');if(!f){say('Connect Media Shelf first.');return}if(f.state!=='live'){say('That fact is already not live.');return}f.script={since:st.now};st.scripted.add(f.id);toStale(f,s);st.settleUntil=performance.now()+1500;st.settleSvc=s.id;say('Media Shelf is now Stale (simulated).');refreshAll()},
 'mock-refuse'(){const s=svcs['notes-sync'];if(!s.connected){say('Connect Notes Sync first, then try this again.');return}s.refused=true;s.facts.forEach(f=>{if(f.state==='live'){f.state='stale';f.sim='stale';f.staleAt=st.now;f.refStale=true}});say('Notes Sync stopped accepting this reference.');refreshAll()},
 'mock-unscoped'(){const s=svcs['media-shelf'];if(!s.connected){say('Connect Media Shelf first.');return}s.scope=null;say('Media Shelf now has an older, unscoped connection.');refreshAll()},
 'hdr-back'(e){},'hdr-settings'(){},
 'reload-view'(){renderView({focus:true})}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act;
 if(t.getAttribute('aria-disabled')==='true'){e.preventDefault();if(a==='cx-next'||a==='cx-run'){const n={reference:'Add a valid reference and tick at least one thing it may be used for.',test:'Run the safe test and let it pass first.',discover:'Choose a service first.',preview:'Dot is still fetching the facts.'}[route()[1]];if(n&&a==='cx-next')say(n)}return}
 if(t.tagName==='A'&&(a==='owner'||a==='hdr-settings'||a==='hdr-back'))e.preventDefault();
 if(a==='hdr-back'){go(st.backTo||'#/home');return}
 if(a==='hdr-settings'){go('#/settings/services');return}
 if(ACT[a])ACT[a](t,e);
});
const CHG={
 'mem-filter'(t){st.memFilter=t.value;renderView({})},
 'cx-pick'(t){if(st.cx.mode==='narrow')return;pick(t.value);updateTop();const n=$('#cx-next');n&&n.removeAttribute('aria-disabled')},
 'cx-cap'(t){const c=st.cx;t.checked?c.scope.add(t.dataset.c):c.scope.delete(t.dataset.c);c.test={n:0,state:'idle',at:null};const m=$('#scope-sentence');if(m)m.innerHTML=`<strong>${c.scope.size?`Worlds will send this reference only when reading: ${esc(list([...c.scope]))}.`:'Tick at least one thing this reference may be used for.'}</strong>`;updateRefUI()},
 'cx-fact'(t){const c=st.cx;if(!t.checked&&c.chosen.size<=1){t.checked=true;say('At least one fact must stay shared.');return}t.checked?c.chosen.add(t.dataset.f):c.chosen.delete(t.dataset.f);keepFocus(()=>renderView({}))},
 'cx-sim'(t){st.cx.simFail=t.checked},
 'w-cap'(t){const s=st.wscope[t.dataset.id];if(!t.checked&&s.size<=1){t.checked=true;return}t.checked?s.add(t.dataset.c):s.delete(t.dataset.c);keepFocus(()=>renderView({}))},
 cadence(t){st.cadence=Number(t.value);say(`Live feed now checks every ${st.cadence} seconds.`)},
 motion(t){st.motion=t.value;applyMotion();say(t.value==='reduce'?'Motion is reduced. Data keeps updating.':'Motion now follows your system.')},
 theme(t){st.theme=t.value;applyTheme()}
};
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.chg;if(c&&CHG[c])CHG[c](t,e)});
document.addEventListener('input',e=>{if(e.target.id==='cx-ref')cxSetRef(e.target.value);else if(e.target.id==='rep-ref'){const m=$('#rep-msg');m&&(m.innerHTML=msgHTML('dirty'))}});
document.addEventListener('focusout',e=>{if(e.target.id==='cx-ref'&&st.cx.refState!=='pending'&&!$('#dlg').open)cxValidate()});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='cx-ref'){e.preventDefault();cxNext()}
 if(e.key==='Enter'&&e.target.id==='rep-ref'){e.preventDefault();const b=$('[data-act="ref-save"]');b&&b.click()}
 if(e.key==='Escape'&&!$('#dlg').open&&route()[0]==='connect'&&!e.defaultPrevented){const ph=st.cx.phase;if(ph==='confirm'){const to=st.cx.returnTo;st.cx=newCx();go(to||'#/home')}}
});
function applyTheme(){const h=document.documentElement;if(st.theme==='system')h.removeAttribute('data-theme');else h.setAttribute('data-theme',st.theme)}
function applyMotion(){const h=document.documentElement;if(st.motion==='reduce')h.setAttribute('data-motion','reduce');else h.removeAttribute('data-motion')}
window.addEventListener('hashchange',onRoute);
window.addEventListener('offline',()=>{st.offline=true;st.backOnline=false;updateTop();say("You're offline. Worlds is showing what it last knew, marked with when.")});
window.addEventListener('online',()=>{st.offline=false;st.backOnline=true;updateTop();say('Back online. Checking now.');setTimeout(()=>{st.backOnline=false;updateTop()},3000)});
matchMedia('(max-width:47.99rem)').addEventListener('change',()=>{renderView({});updateTop()});
if(!navigator.onLine){st.offline=true}
if(!location.hash||location.hash==='#')history.replaceState(null,'','#/welcome/1');
onRoute();
})();
</script>
</body>
