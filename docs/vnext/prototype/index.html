*{box-sizing:border-box}

h1,h2,h3{font-family:var(--wv-serif);font-weight:400;line-height:1.15;margin:0;color:var(--text-primary)}

.skip{position:fixed;left:var(--space-md);top:-6rem;z-index:50;background:var(--action-primary);color:var(--action-on-primary);padding:.65rem 1rem;border-radius:var(--radius-md);font-weight:600}
.skip:focus{top:var(--space-md)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);min-height:var(--wv-target-min);padding:.5rem var(--space-md);border:var(--wv-hairline) solid var(--border-line-strong);border-radius:var(--radius-full);background:var(--surface-raised);color:var(--text-primary);font-size:var(--type-label);font-weight:600;letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:background var(--wv-dur-state) var(--wv-ease),border-color var(--wv-dur-state) var(--wv-ease),color var(--wv-dur-state) var(--wv-ease)}

.actions{display:flex;gap:var(--space-sm);flex-wrap:wrap;align-items:center;margin-top:var(--space-lg)}
.link{color:var(--text-primary);text-decoration:underline;text-underline-offset:.2rem;text-decoration-thickness:.1rem}

/* shell */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:var(--space-md);min-height:var(--wv-top-h);padding:var(--space-sm) var(--space-lg);background:var(--surface-raised);border-bottom:var(--wv-hairline) solid var(--border-line)}
.brand{display:flex;align-items:center;gap:var(--space-md);margin-right:auto}
.wordmark{font-family:var(--wv-serif);font-size:var(--type-h1);margin:0;line-height:1}
.mockup{font-size:var(--type-micro);font-weight:700;letter-spacing:.09em;border:var(--wv-hairline) solid var(--accent-mint);color:var(--accent-mint);padding:.2rem .45rem;border-radius:var(--radius-sm)}
.controls{display:flex;gap:var(--space-sm);flex-wrap:wrap;align-items:center;justify-content:flex-end}

.strip[hidden]{display:none}
#hdr-settings{display:none}
.app{display:grid;grid-template-columns:var(--wv-rail-w) minmax(0,1fr);min-height:calc(100dvh - var(--wv-top-h))}
.rail{background:var(--surface-sunken);border-right:var(--wv-hairline) solid var(--border-line)}
.rail-in{position:sticky;top:var(--wv-top-h);height:calc(100dvh - var(--wv-top-h));padding:var(--space-lg) var(--space-md);display:flex;flex-direction:column;gap:var(--space-xs);overflow:auto}

.nav-item{position:relative;display:flex;align-items:center;gap:.75rem;min-height:var(--wv-target-min);padding:.5rem .75rem;border-radius:var(--radius-md);color:var(--text-primary);text-decoration:none;border:var(--wv-hairline) solid transparent;font-weight:600;background:transparent}
.nav-item svg{width:1.4rem;height:1.4rem;flex:none}
.nav-item:hover{background:var(--surface-raised);border-color:var(--border-line)}
.nav-item[aria-current="page"]{background:var(--surface-raised);border-color:var(--action-primary);font-weight:700}
.badge{min-width:1.5rem;height:1.5rem;padding:0 .4rem;border-radius:var(--radius-full);background:var(--status-needs-you);color:var(--surface-base);font-size:var(--type-small);font-weight:700;display:inline-grid;place-items:center;margin-left:auto}
.tabbar,.fab-slot{display:none}
.main{padding:var(--space-xl);width:100%;max-width:92rem;margin:0 auto;min-width:0}
.page-head{display:flex;gap:var(--space-lg);align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:var(--space-xl)}
.status-slot{display:flex;gap:var(--space-sm);flex-wrap:wrap}
.status-slot:empty{display:none}
.fresh{display:flex;align-items:center;gap:var(--space-sm);margin:var(--space-sm) 0 0;color:var(--text-soft);flex-wrap:wrap}
.status-word{font-weight:700;color:var(--status-needs-you)}
.upd{color:var(--status-done);margin-left:var(--space-sm)}
.sec-title{margin:var(--space-xl) 0 var(--space-md)}
.note{background:var(--surface-raised);border:var(--wv-hairline) solid var(--border-line-strong);border-radius:var(--radius-lg);padding:var(--space-md) var(--space-lg);margin-bottom:var(--space-lg)}
.note .actions{margin-top:var(--space-sm)}

/* chips, dot, stamp */
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:var(--type-small);font-weight:700}
.chip svg{width:1rem;height:1rem;flex:none}
.c-healthy,.c-live{color:var(--status-healthy)}.c-needs_attention{color:var(--status-needs-you)}.c-stale{color:var(--status-stale)}.c-unavailable{color:var(--status-unavailable)}.c-unknown{color:var(--status-unknown)}.c-not_configured{color:var(--status-not_configured)}.c-done{color:var(--status-done)}.c-failed{color:var(--status-failed)}
.dot{height:4.75rem;width:auto;flex:none;display:block}.dot.lg{height:10rem}
.sico{height:2rem;width:auto;flex:none;display:block}
.sico.sm{height:1.75rem}
.who{display:inline-flex;align-items:center;gap:var(--space-sm)}
.slip-who{display:flex;align-items:center;gap:var(--space-sm)}
.svc-id{display:flex;align-items:center;gap:var(--space-md)}
.svc-id .sico{height:2.5rem}
.brand .sico{height:2.25rem}
.hero{width:min(22.5rem,100%);height:auto;display:block}
.scene{width:min(17.5rem,100%);height:auto;display:block}
.note.has-dot{display:flex;gap:var(--space-md);align-items:center}
.dot.nod{transform-origin:25% 90%;animation:nod var(--wv-dur-nod) var(--wv-ease) 1}
.stamp{display:inline-flex;align-items:center;gap:.6rem;color:var(--status-done);font-family:var(--wv-serif);text-transform:uppercase;letter-spacing:.1em;font-size:var(--type-lead);transform:rotate(-4deg);animation:land var(--wv-dur-nod) var(--wv-ease) both}
.stamp img{width:2.5rem;height:auto;flex:none}
.lane{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);padding:var(--space-md);background:var(--surface-sunken);border-radius:var(--radius-lg);overflow:hidden}
.lane .dot{animation:carry var(--wv-dur-carry) var(--wv-ease) both}
.lane-end{border:var(--wv-frame-line) dashed var(--border-line-strong);border-radius:var(--radius-md);padding:var(--space-sm) var(--space-md);color:var(--text-soft)}
@keyframes carry{from{transform:translateX(var(--wv-travel));opacity:0}to{transform:none;opacity:1}}
@keyframes land{from{transform:rotate(-4deg) scale(1.35);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
@keyframes nod{0%,100%{transform:none}50%{transform:rotate(-9deg) translateY(.15rem)}}
@keyframes settle{from{opacity:.35;transform:translateY(.4rem)}to{opacity:1;transform:none}}
@keyframes tick{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}

/* welcome + empty */
.welcome{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(14rem,.7fr);gap:var(--space-xl);padding:var(--space-2xl);background:var(--surface-raised);border:var(--wv-frame-line) solid var(--border-line-strong);border-radius:var(--radius-lg)}
.welcome p{max-width:55ch}
.welcome-dot{display:grid;place-items:center;align-content:center;gap:var(--space-md);background:var(--surface-sunken);border-radius:var(--radius-lg);min-height:15rem;padding:var(--space-lg)}
.empty{display:grid;grid-template-columns:auto 1fr;gap:var(--space-xl);align-items:center;padding:var(--space-xl);border:var(--wv-frame-line) dashed var(--border-line-strong);border-radius:var(--radius-lg);color:var(--text-soft)}
.empty h2{color:var(--text-primary)}
.sel-strip{display:flex;gap:var(--space-md);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-lg)}
.sel-card{display:none}
.checks{display:grid;gap:var(--space-sm);border:0;padding:0;margin:var(--space-md) 0}
.checks legend{font-weight:700;padding:0;margin-bottom:var(--space-sm)}
.check{display:flex;gap:var(--space-md);align-items:flex-start;min-height:var(--wv-target-min);padding:.6rem var(--space-md);background:var(--surface-sunken);border-radius:var(--radius-md);cursor:pointer}
.check input{width:1.4rem;height:1.4rem;margin:.1rem 0 0;accent-color:var(--action-primary);flex:none}
.check[aria-disabled="true"]{opacity:.8}

/* counter */
.home-grid{display:grid;grid-template-columns:minmax(16rem,var(--wv-slips-w)) minmax(0,1fr);gap:var(--space-xl);align-items:start}
.slips{list-style:none;display:grid;gap:var(--space-md)}

.slip-top{display:flex;justify-content:space-between;gap:var(--space-sm);align-items:flex-start}
.slip-name{display:block;font-family:var(--wv-serif);font-size:var(--type-lead);line-height:1.2}

const shortAge=n=>n<60?n+'s':n<3600?Math.floor(n/60)+'m':Math.floor(n/3600)+'h';
const ageTxt=(t,v)=>t==null?'never '+v:v+' '+shortAge(Math.max(0,Math.round((st.now-t)/1000)))+' ago';
const fs=f=>f.state==='live'&&f.obs==null?'unknown':f.state;
const fmtVal=(v,u)=>(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v)?fmtDT(Date.parse(v)):typeof v==='number'?v.toLocaleString('en-US'):v)+(u?' '+u:'');

const freshest=()=>{const ts=st.connected.map(id=>svcs[id].checkedAt).filter(x=>x!=null);return ts.length?Math.max(...ts):null};
const tsOf=k=>{if(k==='top')return freshest();const[t,a,b]=k.split('|');if(t==='s')return svcs[a]&&svcs[a].checkedAt;if(t==='f'){const f=svcs[a]&&svcs[a].facts.find(x=>x.id===b);return f&&f.obs}if(t==='t')return st.cx.test.at;return null};

const POSE={rest:'dot',asleep:'dot-asleep',welcome:'dot-welcome',nod:'dot-nod',parcel:'dot-parcel',goodbye:'dot-goodbye',curious:'dot-curious'};
const img=(k,cls='')=>`<img class="${cls}" alt="" aria-hidden="true" src="${ART[k]}">`;
function dot(pose='rest',cls=''){return img(POSE[pose]||'dot',('dot '+cls).trim())}
const sico=(id,cls='')=>ART['icon-'+id]?img('icon-'+id,('sico '+cls).trim()):'';
document.querySelectorAll('[data-art]').forEach(e=>{e.src=ART[e.dataset.art]});
const stampHTML=()=>`<span class="stamp">${img('stamp')}Connected</span>`;

/* ---------- state helpers ---------- */
function svcState(s){if(s.refused)return['unavailable',false];if(s.state==='healthy'){if(s.facts.some(f=>f.sim==='unknown'))return['unknown',true];if(s.facts.some(f=>f.sim==='stale'))return['stale',true]}return[s.state,false]}
function simAt(s){const f=s.facts.find(x=>x.sim);return f?(f.staleAt||st.now):st.now}
function lines(s,full){
 const[k,sim]=svcState(s),o=[];
 if(s.refused){o.push(`${s.name} refused the reference. Last facts kept, with check times. Fix it in ${s.name}.`);return o}
 if(sim){o.push(k==='stale'?`No change seen since ${fmtT(simAt(s))}.`:'No current reading. Not guessing.');return o}
 if(k==='needs_attention'&&s.reason)o.push(s.reason);
 o.push(s.summary);
 if(k==='stale')o.push(`No change seen since ${fmtT(s.checkedAt)}.`);
 if(k==='unknown'){if(full&&s.unknownReason)o.push(s.unknownReason);o.push('No current reading. Not guessing.')}
 if(full&&k==='unavailable')o.push(s.id==='studio-printer'?'Printer answered, so not silent.':'Stopped answering. Last facts kept, with check times.');
 if(k==='not_configured')o.push('Not set up. Open settings.');
 return o;
}
const attn=()=>st.connected.filter(id=>svcs[id].state==='needs_attention').length;
const selSvc=()=>st.selected&&svcs[st.selected]&&svcs[st.selected].connected?svcs[st.selected]:null;
const selFact=s=>s.facts.find(f=>f.id===st.fact[s.id])||s.facts[0];
function statusHTML(){
 if(!st.connected.length)return 'Nothing connected.';
 const n=attn(),a=` · ${ageSpan('top')}`;
 if(n)return `<span class="status-word">${n} needs you</span>${a}`;
 return (st.lastOne?'Last one done. ':'')+'Nothing needs you'+(st.lastOne?'.':'')+a;
}
const nod=()=>performance.now()<st.nodUntil,upd=()=>performance.now()<st.updUntil;
const freshLine=()=>`<p class="fresh">${dot(nod()?'nod':'rest',nod()?'nod':'')}<span>${statusHTML()}</span>${upd()?'<strong class="upd">Updated now</strong>':''}</p>`;
const noteTop=()=>(route()[0]||'home');
function noteHTML(){const n=st.note;if(!n||n.view!==noteTop())return '';return `<div class="note${n.bye?' has-dot':''}" data-od-id="last-change">${n.bye?dot('goodbye'):''}<div><p>${esc(n.text)}</p><div class="actions">${n.reconnect?`<button class="btn" type="button" data-act="reconnect" data-id="${n.reconnect}">Reconnect</button>`:''}${n.owner?ownerLink(svcs[n.owner]):''}<button class="btn text" type="button" data-act="dismiss-note">Dismiss</button></div></div></div>`}
const pageHead=title=>`<header class="page-head" data-od-id="page-head"><div><h1 tabindex="-1">${title}</h1>${freshLine()}</div><div class="status-slot"></div></header>${noteHTML()}`;
const ownerLink=(s,cls='')=>`<a class="btn ${cls}" href="${esc(s.owner.route)}" data-act="owner" data-fk="owner-${s.id}" data-app="${esc(s.owner.app)}">${esc(s.owner.label)}</a>`;
const permText=(s,f)=>({a:{read:'sees it',act:'acts on it',none:'no access'}[f.agent],h:{read:'sees it',write:'edits the local copy',act:`acts in ${s.owner.app}`,none:'no access'}[f.human]});
function permHTML(s,f){const t=permText(s,f);const row=(who,p,txt,reason)=>{if(p==='none'){const id='pr'+(++uid);return `<div class="perm"><button type="button" class="btn perm-none" aria-disabled="true" aria-describedby="${id}">${who}: ${txt}</button><span class="perm-line muted" id="${id}">${esc(reason||'')}</span></div>`}return `<p class="perm-line"><strong>${who}:</strong> ${txt}.${reason?` <span class="muted">${esc(reason)}</span>`:''}</p>`};return row('Agent',f.agent,t.a,f.aReason)+row('Human',f.human,t.h,f.hReason)}
const scopeWord=s=>s.scope?`Scoped to ${capN(s.scope.length)}`:'Unscoped';
const provenance=s=>`${s.during==='first run'?'Connected in first run':'Connected '+fmtT(s.connectedAt)} · reference only, never the secret.`;
function factInner(s,f){const lk=f.state==='stale'?'<span class="micro muted">last known</span>':'';return `<span class="fact-main"><span class="fact-label">${esc(f.label)}</span><span class="micro muted">${ageSpan('f|'+s.id+'|'+f.id)}</span></span><span class="fact-val"><strong>${esc(fv(f))}</strong>${lk}${chip(fs(f),f.sim?' (simulated)':'')}</span>`}
function factBtn(s,f){return `<li><button type="button" class="fact" data-act="fact" data-s="${s.id}" data-f="${esc(f.id)}" data-fk="fact-${s.id}-${esc(f.id)}" aria-pressed="${selFact(s)===f}">${factInner(s,f)}</button></li>`}

/* ---------- receipt ---------- */
function receiptHTML(s,f){
 if(!f)return `<section class="receipt" data-od-id="fact-receipt"><h3>No facts</h3><p>${esc(s.emptyReason||'Nothing here yet.')}</p></section>`;
 const settle=performance.now()<st.settleUntil&&st.settleSvc===s.id;
 const srcW=f.src==='local'?'From this device':f.src==='external'?"From its provider":'No source answered';
 let lead;
 const fst=fs(f);
 if(fst==='unknown')lead=`No current reading. <strong>Unknown</strong>.${f.lastVal!==undefined?` Last known: ${esc(fmtVal(f.lastVal,f.unit))} at ${fmtT(f.lastAt)}.`:''}`;
 else if(fst==='stale')lead=`Last known from ${esc(s.owner.app)}: <strong>${esc(fv(f))}</strong>.`;
 else if(fst==='unavailable')lead=f.value==null?`Nothing came back. <strong>Unavailable</strong>.`:`${esc(s.owner.app)} said <strong>${esc(fv(f))}</strong>, marked Unavailable.`;
 else lead=`${esc(s.owner.app)} said <strong>${esc(fv(f))}</strong>.`;
 const tk=svg(GL.check);
 return `<section class="receipt ${settle?'settle':''}" data-od-id="fact-receipt" aria-label="Receipt for ${esc(f.label)}"><div class="receipt-head"><p class="micro muted">Where it came from</p><h3>${esc(f.label)}</h3><p class="val">${esc(fv(f))}</p></div>
 <div class="stations">
  <div class="station" style="--i:0"><h3>Source<span class="tk">${tk}</span></h3><p>${lead}</p><span class="st-line">${srcW}</span><span class="st-line">State: ${chip(fs(f),f.sim?' (simulated)':'')}</span><span class="st-line">${ageSpan('f|'+s.id+'|'+f.id)}</span>${f.sim?`<div class="actions"><button type="button" class="btn" data-act="check" data-s="${s.id}" data-f="${esc(f.id)}">Check now</button></div>`:''}</div>
  <div class="station" style="--i:1"><h3>Worlds<span class="tk">${tk}</span></h3><p>Shared as <strong>${esc(f.label)}</strong>.</p><span class="st-line">Fact id: <code>${esc(f.id)}</code></span><span class="st-line">${esc(provenance(s))}</span><span class="st-line">${scopeWord(s)}</span></div>
  <div class="station" style="--i:2"><h3>Agent / Human<span class="tk">${tk}</span></h3>${permHTML(s,f)}</div>
 </div></section>`;
}
function seesHTML(s){const a=s.facts.filter(f=>f.agent!=='none'),h=s.facts.filter(f=>f.agent==='none');if(!s.facts.length)return '';return `<p class="sees"><strong>Agent sees:</strong> ${esc(list(a.map(f=>f.label))||'nothing')}.${h.length?` <span class="muted">Agent can't see: ${esc(list(h.map(f=>f.label)))}.</span>`:''}</p>`}
function retryHTML(s){if(!s.retry)return '';return `<div class="retry" data-od-id="owner-retry-${s.id}"><p><strong>${esc(s.retry.label)}</strong>: tried ${pl(s.retry.attempts,'time')}. Last error: ${esc(s.retry.lastError)}.</p><p class="muted">You retry in ${esc(s.owner.app)}. Worlds can't.</p>${ownerLink(s)}</div>`}

/* ---------- app frame ---------- */
const PLAN={'front-door':'refused','notes-sync':'timeout'};
function ensureFrame(id){if(st.frames[id])return;st.frames[id]={state:'loading',tries:0};loadFrame(id)}
function loadFrame(id){const fr=st.frames[id];fr.state='loading';fr.tries++;paintFrame(id);clearTimeout(fr.t);fr.t=setTimeout(()=>{if(fr.state!=='loading')return;fr.state=fr.tries===1&&PLAN[id]?PLAN[id]:'loaded';paintFrame(id)},fr.tries===1?900:500)}
function frameInner(s){const fr=st.frames[s.id]||{state:'loading'};const w={loading:'Loading',loaded:'Loaded',refused:'Not shown',timeout:'Not shown',cancelled:'Not shown'}[fr.state];let body='',ctl='';
 if(fr.state==='loading'){body=`<div class="frame-body" style="display:flex;gap:1rem;align-items:center">${dot('rest')}<p>Fetching the app…</p></div>`;ctl=`<button type="button" class="btn" data-act="frame-cancel" data-id="${s.id}">Cancel</button>`}
 else if(fr.state==='loaded'){body=`<div class="frame-body"><div class="mini-app" role="group" aria-label="${esc(s.owner.app)} app preview, contained"><p class="micro muted">${esc(s.owner.app)} · preview</p><p><strong>${esc(s.name)}</strong></p><p class="muted">${esc(s.summary)}</p><ul style="list-style:none">${s.facts.map(f=>`<li>${esc(f.label)}: <strong>${esc(fv(f))}</strong></li>`).join('')}</ul></div></div><p class="frame-foot muted">No Worlds credentials in here.</p>`;ctl=`<button type="button" class="btn" data-act="frame-retry" data-id="${s.id}">Reload</button>`}
 else{const cause=fr.state==='timeout'?'Too slow.':fr.state==='cancelled'?'Cancelled.':"It won't show inside another page.";body=`<div class="frame-body"><p><strong>Didn't load here.</strong></p><p class="muted">${cause} Use the link, or try again.</p></div>`;ctl=`<button type="button" class="btn" data-act="frame-retry" data-id="${s.id}">Try again</button>`}
 return `<div class="frame-bar"><strong>${esc(s.owner.app)} app, shown here</strong><span class="micro muted">${w}</span></div>${body}<div class="frame-foot actions" style="margin-top:0">${ownerLink(s)}${ctl}</div>`}
function paintFrame(id){const el=document.getElementById('frame-'+id);if(el&&svcs[id].connected)keepFocus(()=>{el.innerHTML=frameInner(svcs[id])})}

function journeyHTML(){if(st.journeySeen)return '';return `<aside class="journey" data-od-id="fact-journey"><h3>One fact, traced.</h3><p>Media Shelf holds 1,284 items. Where from, who sees it, who acts.</p><div class="mini-stations" aria-hidden="true"><span>Source · Media Shelf, local</span><span>Worlds · Items in library</span><span>Agent / Human</span></div><p class="muted">Every fact shows this.</p><button type="button" class="btn" data-act="dismiss-journey">Got it</button></aside>`}
function detailHTML(s,h1){
 ensureFrame(s.id);const[k,sim]=svcState(s),f=selFact(s);const pushed=h1;
 const title=h1?`<h1 class="svc-title" tabindex="-1">${esc(s.name)}</h1>`:`<h2 class="svc-title" tabindex="-1">${esc(s.name)}</h2>`;
 const dis=h1?'<div class="disc-slot"></div>':'';

 return `<div class="detail" data-od-id="service-detail"><div class="svc-head"><div><div class="svc-id">${sico(s.id)}${title}</div><div class="meta">${k==='stale'?dot('curious'):''}${chip(k,sim?' (simulated)':'')}<span>Owned by ${esc(s.owner.app)}</span><span>${ageSpan('s|'+s.id)}</span></div></div>${dis}</div>
 <div class="lines">${lines(s,true).map(l=>`<p class="muted">${esc(l)}</p>`).join('')}</div>
 <div class="svc" data-tab="${st.tab}"><div class="tabs" role="tablist" aria-label="${esc(s.name)} views">${['facts:Facts','app:App','agent:Agent view'].map(x=>{const[a,b]=x.split(':');return `<button type="button" role="tab" class="btn" data-act="tab" data-t="${a}" data-fk="tab-${a}" aria-selected="${st.tab===a}">${b}</button>`}).join('')}</div>
 <section class="pane pane-facts" aria-label="Facts">${s.facts.length?`<ul class="facts-list">${s.facts.map(x=>factBtn(s,x)).join('')}</ul>`:''}${journeyHTML()}${receiptHTML(s,f)}${seesHTML(s)}${ev}${retryHTML(s)}${kept}</section>
 <section class="pane pane-app" aria-label="App">${s.owner.app==='x'?'':`<div class="frame" id="frame-${s.id}" data-od-id="app-frame">${frameInner(s)}</div>`}</section>
 <section class="pane pane-agent" aria-label="Agent view">${s.facts.map(x=>factCard(s,x)).join('')||`<p class="muted">${esc(s.emptyReason||'No facts.')}</p>`}</section></div></div>`;
}
function selCard(s){if(!s)return `<div class="sel-strip"><p>Nothing selected.</p><div class="disc-slot"></div><p class="muted" id="disc-reason">Connect something first</p></div>`;const[k,sim]=svcState(s);return `<div class="sel-card" data-od-id="selected-card"><p class="micro muted">Selected</p><h2 style="font-size:var(--type-h1)">${esc(s.name)}</h2><p>${chip(k,sim?' (simulated)':'')}</p><p class="muted">${esc(lines(s,false)[0])}</p><div class="actions"><button type="button" class="btn" data-act="open-svc" data-id="${s.id}">Open ${esc(s.name)}</button><div class="disc-slot"></div></div></div>`}
function viewHome(r){

 else if(sid)st.selected=sid;

 return `${pageHead('Your counter')}${selCard(s)}<div class="home-grid"><section aria-labelledby="slips-h" data-od-id="slips"><h2 id="slips-h" class="sr-only">Services</h2><ul class="slips">${st.connected.map(id=>slipHTML(svcs[id])).join('')}</ul></section>${s?detailHTML(s,false):''}</div>`;

function factCard(s,f){const settle=performance.now()<st.settleUntil&&st.settleSvc===s.id;const unk=fs(f)==='unknown';
 return `<article class="fact-card ${settle?'settle':''}"><div><h3>${esc(f.label)}</h3><p class="big">${esc(fv(f))}${f.state==='stale'?' <span class="micro muted">(last known)</span>':''}</p>${chip(fs(f),f.sim?' (simulated)':'')}<p class="micro muted">${f.src==='local'?'From this device':f.src==='external'?"From its provider":'No source answered'} · ${ageSpan('f|'+s.id+'|'+f.id)} · ${scopeWord(s)}</p>${f.lastVal!==undefined?`<p class="micro muted">Last known: ${esc(fmtVal(f.lastVal,f.unit))} at ${fmtT(f.lastAt)}.</p>`:''}${unk?`<p class="micro">Can't see it. ${esc(s.unknownReason||'')} Needs the owning app to answer.</p>`:''}${f.sim?`<button type="button" class="btn" data-act="check" data-s="${s.id}" data-f="${esc(f.id)}">Check now</button>`:''}</div><div>${permHTML(s,f)}</div></article>`}
function viewMemory(){

function viewNeeds(){

/* ---------- welcome ---------- */
function viewWelcome(n){
 st.beat=n;const head='';
 if(n===1)return `<section class="welcome" data-od-id="welcome-1"><div class="welcome-copy"><h1 tabindex="-1">Hello, I'm Dot.</h1><p>A small counter for your services' facts.</p><p class="muted">Connect the first one? Nothing here touches a network.</p><div class="actions"><button type="button" class="btn primary" data-act="w-next" data-fk="w-next">Connect a service</button><button type="button" class="btn" id="skip-welcome" data-act="skip-welcome">Skip welcome</button></div></div><div class="welcome-dot">${dot('asleep','lg')}<p class="muted">Dot's asleep.</p></div></section>`;
 const id=n===2?'media-shelf':'front-door',s=svcs[id],w=st.wstate[id]||'idle',sc=st.wscope[id];

 const heading=n===2?'First, Media Shelf.':'Then Front Door.';

 if(w==='idle'){side=`<div class="welcome-dot">${n===2?img('hero-welcome','hero'):dot('welcome','lg')}<p class="muted">Dot's awake.</p></div>`;act=`<button type="button" class="btn primary" data-act="w-connect" data-id="${id}" data-fk="w-connect">Connect ${esc(s.name)}</button>`}
 else if(w==='delivering'){side=`<div class="welcome-dot"><div class="lane" style="width:100%">${dot('parcel')}<span class="lane-end">Counter</span></div><p>Carrying it over…</p></div>`;act=''}
 else{side=`<div class="welcome-dot">${stampHTML()}${dot('nod','lg nod')}<p><strong>${esc(s.name)} is here.</strong></p></div>`;act=`<button type="button" class="btn primary" data-act="w-continue" data-fk="w-continue" id="w-continue">${n===2?'Next: Front Door':'See the counter'}</button>`}
 return `<section class="welcome" data-od-id="welcome-${n}"><div class="welcome-copy"><h1 tabindex="-1">${heading}</h1><p class="muted">${esc(s.kind)} · ${esc(s.owner.app)} app</p><fieldset class="checks" ${w!=='idle'?'disabled':''}><legend>Reference used only to read: ${esc(list([...sc]))}.</legend>${capsHTML}</fieldset><p>${chip('done')} Passed. Nothing changed.</p><p class="micro muted"><code>ref://${id}</code> · mock handle · no network.</p><div class="actions">${act}${w==='idle'&&n===3?'<button type="button" class="btn" data-act="w-back">Back</button>':''}${w==='idle'&&n===2?'<button type="button" class="btn" data-act="w-back">Back</button>':''}<button type="button" class="btn text" id="skip-welcome" data-act="skip-welcome">Skip welcome</button></div></div>${side}</section>`;

/* ---------- connect ---------- */
const STEPS=['discover','reference','test','preview','choose','publish'],SN=['Discover','Reference','Test','Preview','Choose','Publish'];
const refCheck=v=>{v=(v||'').trim();if(!v)return'empty';const m=/^ref:\/\/([A-Za-z0-9][A-Za-z0-9_-]{0,48})$/.exec(v);if(!m)return'secret';if(/^(PW_|OIDC_)/i.test(m[1])||/BOOTSTRAP/i.test(m[1]))return'own';return'valid'};
const REFMSG={pristine:['','Use the form ref://name.'],dirty:['','Checked when you leave the field.'],valid:['done','Looks like a reference.'],secret:['failed','That looks like a secret. Cleared, not saved. Use a reference, like ref://notes-sync.'],own:['failed',"That points at one of Worlds' own secrets. Can't use it here."],pending:['','Saving…']};
const msgHTML=k=>{const[c,t]=REFMSG[k];return `${c==='done'?svg(GL.check,'c-done'):c==='failed'?svg(GL.x,'c-failed'):''}<span class="${c?'c-'+c:''}">${t}</span>`};
function cxGuard(step){const c=st.cx,i=STEPS.indexOf(step);if(i<0)return'discover';if(i>=1&&!c.sid)return'discover';if(i>=2&&!(c.refState==='valid'&&c.scope.size))return'reference';if(i>=3&&c.test.state!=='passed')return'test';if(i>=5&&!c.chosen.size)return'choose';return step}
function pick(id){const c=st.cx,keep=c.mode;Object.assign(c,newCx(),{mode:keep==='narrow'?'narrow':'new',sid:id,scope:new Set(caps(id)),chosen:new Set(DEFS[id].facts().map(f=>f.id))})}
function cxBar(step){const c=st.cx,i=STEPS.indexOf(step);let next='';
 if(step==='publish'){if(c.phase==='delivering')return '';if(c.phase==='done')return ''}
 const dis=(step==='discover'&&!c.sid)||(step==='reference'&&!(c.refState==='valid'&&c.scope.size))||(step==='test'&&c.test.state!=='passed')||(step==='preview'&&!c.ready)||(step==='choose'&&!c.chosen.size);
 const label=step==='publish'?'Publish':step==='reference'&&c.mode==='narrow'?'Save narrower scope':step==='reference'&&c.mode==='replace'?'Save reference':'Next';
 next=`<button type="button" class="btn primary" id="cx-next" data-act="cx-next" ${dis?'aria-disabled="true"':''}>${label}</button>`;
 return `<div class="cx-bar" data-od-id="connect-bar"><button type="button" class="btn text" data-act="cx-cancel">Cancel</button><span style="flex:1"></span>${i>0&&!(c.mode==='replace'&&step==='reference')?'<button type="button" class="btn" data-act="cx-back">Back</button>':''}${next}</div>`}
function viewConnect(step){
 const c=st.cx,i=STEPS.indexOf(step),s=c.sid?svcs[c.sid]:null;let body='';
 const refreshStep=`<p class="step-line">Step ${i+1} of 6 · ${SN[i]}</p>`;
 if(step==='discover'){
  const cands=c.mode==='narrow'?[c.sid]:CANDS.filter(id=>!svcs[id].connected),here=st.connected;
  if(!c.sid&&cands.length)pick(cands[0]);
  body=`<h1 tabindex="-1">Find a service</h1><p class="says">Looking only. No credential sent. Nothing changed.</p>${cands.length?`<fieldset class="checks" style="border:0;padding:0"><legend>Available</legend>${cands.map(id=>{const d=svcs[id];return `<label class="cand"><input type="radio" name="cand" value="${id}" data-chg="cx-pick" ${c.sid===id?'checked':''}><span><span class="who">${sico(id,'sm')}<strong class="slip-name">${esc(d.name)}</strong></span><br><span class="micro muted">${esc(d.kind)} · ${esc(d.owner.app)} app</span><br><span class="micro">Not connected · no reading</span> · <span class="micro">Auth: unknown</span><ul>${caps(id).map(x=>`<li>${esc(x)} · unverified</li>`).join('')}</ul></span></label>`}).join('')}</fieldset>`:'<p class="empty">Nothing else to connect.</p>'}${here.length&&c.mode!=='narrow'?`<h2 class="sec-title" style="font-size:var(--type-h1)">Already connected</h2><p class="muted">${esc(list(here.map(id=>svcs[id].name)))}</p>`:''}`;
 }else if(step==='reference'){
  const pend=c.refState==='pending';
  body=`<h1 tabindex="-1">Credential reference</h1><p class="says">A name pointing to a secret kept elsewhere. Worlds stores the name only.</p><div class="field"><label for="cx-ref"><strong>Reference for ${esc(s.name)}</strong></label><input type="text" id="cx-ref" data-fk="cx-ref" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ref://${esc(s.id)}" value="${esc(c.ref)}" aria-describedby="ref-msg" ${c.refState==='secret'||c.refState==='own'?'aria-invalid="true"':''} ${pend?'readonly':''}><p class="msg" id="ref-msg" aria-live="polite">${msgHTML(c.refState)}</p></div>
  <fieldset class="checks"><legend>May be used for</legend>${caps(s.id).map(x=>`<label class="check"><input type="checkbox" data-chg="cx-cap" data-c="${esc(x)}" ${c.scope.has(x)?'checked':''}><span>${esc(x)}</span></label>`).join('')}</fieldset>
  <p id="scope-sentence"><strong>${c.scope.size?`Used only to read: ${esc(list([...c.scope]))}.`:'Tick at least one.'}</strong></p><p class="muted">Scope only. What shows on the counter comes later.</p>`;
 }else if(step==='test'){
  const t=c.test;let res='';
  if(t.state==='running')res=`<div class="panel" style="display:flex;gap:1rem;align-items:center">${dot('rest')}<p>Testing…</p></div>`;
  else if(t.state==='passed')res=`<div class="panel"><p>${chip('done')} <strong>Passed. ${DEFS[s.id].facts().length} facts read. Nothing changed.</strong></p></div>`;
  else if(t.state==='failed'||t.state==='limit')res=`<div class="panel"><p>${chip('failed')} <strong>Didn't go through. Reference kept. Try again.</strong></p><p class="muted">Provider timed out · ${ageSpan('t|','tried')} · try ${t.n} of 3</p>${t.state==='limit'?'<p>Three tries. Check the reference in the owning app, then edit it.</p>':''}</div>`;
  const dis=t.state==='running'||t.state==='limit';
  body=`<h1 tabindex="-1">Run a safe test</h1><p class="says">One read. Nothing changes. Scope: ${esc(list([...c.scope]))}.</p><label class="check"><input type="checkbox" data-chg="cx-sim" ${c.simFail?'checked':''}><span>Simulate a failed test (mock)</span></label><div class="actions"><button type="button" class="btn ${t.state==='passed'?'':'primary'}" id="cx-run" data-act="cx-run" ${dis?'aria-disabled="true"':''}>${t.state==='failed'?'Try again':'Run safe test'}</button></div><div aria-live="polite">${res}</div>`;
 }else if(step==='preview'){
  body=`<h1 tabindex="-1">What ${esc(s.name)} offers</h1>`+(c.ready?`<p class="says">Separate facts. Capabilities verified.</p>${DEFS[s.id].facts().length?DEFS[s.id].facts().map(f=>`<div class="pre-fact"><span><strong>${esc(f.label)}</strong><br><span class="micro muted">${esc(caps(s.id).includes(f.label)?'verified':'')}</span></span><span style="text-align:right"><strong>${esc(fv(f))}</strong><br>${chip(fs(f))}</span></div>`).join(''):'<p class="empty">No facts yet. Nothing guessed.</p>'}`:`<div class="panel" style="display:flex;gap:1rem;align-items:center">${dot('rest')}<div><p>Fetching facts…</p><p class="micro muted">Stalled? ${ownerLink(s,'text')}</p></div></div>`);
 }else if(step==='choose'){
  const fl=DEFS[s.id].facts(),last=c.chosen.size===1;
  body=`<h1 tabindex="-1">Choose what to show</h1><p class="says">Shown, and visible to agents: ${esc(list(fl.filter(f=>c.chosen.has(f.id)).map(f=>f.label))||'nothing')}.</p><fieldset class="checks"><legend>Facts to publish</legend>${fl.map(f=>{const lock=last&&c.chosen.has(f.id);return `<label class="check" ${lock?'aria-disabled="true"':''}><input type="checkbox" data-chg="cx-fact" data-f="${esc(f.id)}" ${c.chosen.has(f.id)?'checked':''} ${lock?'aria-disabled="true"':''}><span><strong>${esc(f.label)}</strong><br><span class="micro muted">${esc(fv(f))} · ${SW[fs(f)][1]}${lock?' · Keep at least one.':''}</span></span></label>`}).join('')}</fieldset><p class="muted">Keep at least one fact.</p>`;
 }else{
  const fl=DEFS[s.id].facts(),shown=fl.filter(f=>c.chosen.has(f.id)),out=fl.filter(f=>!c.chosen.has(f.id));
  let tail='';
  if(c.phase==='delivering')tail=`<div class="lane">${dot('parcel')}<span class="lane-end">Counter</span></div><p>Carrying it over…</p>`;

/* ---------- connection logic ---------- */
function resetSvc(id){Object.assign(svcs[id],mkBase(id))}
function applyLock(s){const b=s.facts.find(f=>f.id==='frontdoor.back-door'),u=s.facts.find(f=>f.id==='frontdoor.unlocked-for');if(b){b.value='locked';b.obs=st.now}if(u){u.value=0;u.obs=st.now;u.sim='sim'}s.state='healthy';s.reason=null;s.summary='Back door locked. Home still owns it.';s.checkedAt=st.now}
function connectSvc(id,o){
 resetSvc(id);const s=svcs[id];
 s.connected=true;s.ref=o.ref;s.heldRef=false;s.scope=o.scope?[...o.scope]:null;s.during=o.during;s.connectedAt=st.now;s.keptOut=o.omit||[];
 s.facts=s.facts.filter(f=>!s.keptOut.includes(f.id));
 s.facts.forEach(f=>{f.nextChk=st.now+30000});
 if(id==='front-door'&&st.doorLocked)applyLock(s);
 if(!st.connected.includes(id))st.connected.push(id);
 st.selected=id;st.fact[id]=s.facts[0]&&s.facts[0].id;delete st.frames[id];st.lastOne=false;
 const f=s.facts.find(x=>x.state==='live');
 if(f&&!st.scripted.has(f.id)){
  if(id==='media-shelf'&&!st.scripted.has('media.items')){const m=s.facts.find(x=>x.id==='media.items');if(m){st.scripted.add(m.id);m.script={since:st.now,stage:0}}}
  else if(o.via==='connect'&&!st.armConn&&id!=='media-shelf'){st.armConn=true;st.scripted.add(f.id);f.script={since:st.now,stage:0}}
 }
}
function toStale(f,s){f.state='stale';f.sim='stale';f.staleAt=st.now;f.script=f.script||{since:st.now};f.script.stage=1;f.script.at=st.now}
function toUnknown(f){f.lastVal=f.value;f.lastAt=f.obs;f.value=null;f.state='unknown';f.sim='unknown';f.script.stage=2}
function stepFacts(){let changed=null;
 for(const id of st.connected){const s=svcs[id];for(const f of s.facts){
  const sc=f.script;
  if(sc&&sc.stage===0&&f.state==='live'&&st.now-sc.since>=90000){toStale(f,s);changed=`${s.name} is now Stale.`;continue}
  if(sc&&sc.stage===1&&f.state==='stale'&&st.now-sc.at>=60000){toUnknown(f);changed=`${s.name} is now Unknown.`;continue}
  if(f.state==='live'&&s.state!=='needs_attention'&&!s.refused&&f.nextChk&&st.now>=f.nextChk){f.obs=st.now;f.nextChk+=30000;if(s.state==='healthy')s.checkedAt=st.now}
 }}
 return changed}
function tick(){
 if(!st.welcomeDone||!st.live||st.offline)return;
 st.now+=1000;st.sec++;const ch=stepFacts();
 if(ch){st.settleUntil=performance.now()+1500;say(ch+' (simulated)');refreshAll()}
 else if(st.sec%st.cadence===0){refreshAges();updateTop()}
}
setInterval(tick,1000);
function toggleLive(){st.live=!st.live;updateTop();say(st.live?'Live feed on.':'Paused. Freshness frozen.',{keep:!st.live})}
function simulate(){
 const s=svcs['front-door'];
 if(!s.connected){say("Front Door isn't connected. Nothing to update.");return}
 if(st.doorLocked){say('Already reported locked.');return}
 st.doorLocked=true;applyLock(s);st.lastOne=attn()===0;
 st.nodUntil=performance.now()+1000;st.updUntil=performance.now()+3000;st.settleUntil=performance.now()+1500;st.settleSvc='front-door';

}

function cxValidate(){const c=st.cx,k=refCheck(c.ref);if(k==='empty'){c.refState='pristine'}else if(k==='secret'){c.ref='';c.refState='secret';const i=$('#cx-ref');if(i)i.value=''}else if(k==='own')c.refState='own';else c.refState='valid';updateRefUI();return c.refState==='valid'}
function cxNext(){
 const step=route()[1],c=st.cx,i=STEPS.indexOf(step);
 if(step==='reference'){if(!cxValidate()||!c.scope.size){const f=$('#cx-ref');f&&f.focus();return}
  if(c.mode==='narrow'||c.mode==='replace'){const s=svcs[c.sid];s.ref=c.ref;s.scope=[...c.scope];if(c.mode==='replace'){s.refused=false;s.facts.forEach(f=>{if(f.sim==='stale'&&f.script)return;if(f.refStale){f.state='live';f.sim=null;delete f.refStale}});}const to=c.returnTo;say(c.mode==='narrow'?`${s.name}: scope now ${capN(c.scope.size)}.`:`${s.name}'s reference replaced. Checking now.`);st.cx=newCx();go(to);return}
  c.refState='pending';updateRefUI();const inp=$('#cx-ref');inp&&inp.setAttribute('readonly','');setTimeout(()=>{c.refState='valid';go('#/connect/test')},600);return}
 if(step==='publish'){publish();return}
 go('#/connect/'+STEPS[i+1]);
}
function runTest(){const c=st.cx,t=c.test;if(t.state==='running'||t.state==='limit'||refCheck(c.ref)!=='valid'||!c.scope.size)return;t.state='running';keepFocus(()=>renderView({}));
 setTimeout(()=>{t.at=st.now;if(c.simFail){t.n++;t.state=t.n>=3?'limit':'failed';say('Test failed.',{loud:true})}else{t.state='passed';t.n=0}if(routeKey()==='connect/test'){renderView({});const el=t.state==='passed'?$('#cx-next'):$('#cx-run');el&&el.focus()}},900)}
function publish(){const c=st.cx,s=svcs[c.sid];if(c.phase!=='confirm')return;
 const omit=DEFS[c.sid].facts().filter(f=>!c.chosen.has(f.id)).map(f=>f.id);
 connectSvc(c.sid,{ref:c.ref,scope:c.scope,during:'connect',omit,via:'connect'});c.phase='delivering';renderNav();renderView({focus:true});updateTop();
 const dur=matchMedia('(prefers-reduced-motion:reduce)').matches||st.motion==='reduce'?0:isPhone()?300:400;
 setTimeout(()=>{c.phase='done';if(routeKey()==='connect/publish'){renderView({focus:true});const o=$('#cx-open');o&&o.focus()}say(`${s.name} connected.`)},dur+60)}

/* ---------- actions ---------- */
function startConnectWith(id,mode,ref,to){st.cx=newCx();const c=st.cx,s=svcs[id];Object.assign(c,{mode,sid:id,ref:ref||'',refState:ref?'valid':'pristine',scope:new Set(s.scope||caps(id)),chosen:new Set(DEFS[id].facts().map(f=>f.id)),returnTo:to||'#/home'});}
const ACT={
 live:toggleLive,simulate,
 add(){if(!st.welcomeDone){st.welcomeDone=true;st.replay=false}st.cx=newCx();go('#/connect/discover')},
 disconnect(){const s=selSvc();if(s)openDisconnect(s.id)},
 'disc-row'(t){openDisconnect(t.dataset.id)},
 slip(t){st.selected=t.dataset.id;st.tab='facts';if(isPhone())go('#/home/'+t.dataset.id);else{history.replaceState(null,'','#/home/'+t.dataset.id);renderView({});updateTop()}},
 'open-svc'(t){go('#/home/'+t.dataset.id)},
 'back-home'(){go('#/home')},
 fact(t){st.fact[t.dataset.s]=t.dataset.f;renderView({})},
 tab(t){st.tab=t.dataset.t;renderView({})},
 owner(t){ownerNote(t.dataset.app)},
 'frame-retry'(t){loadFrame(t.dataset.id)},
 'frame-cancel'(t){const fr=st.frames[t.dataset.id];clearTimeout(fr.t);fr.state='cancelled';paintFrame(t.dataset.id)},
 check(t){const s=svcs[t.dataset.s],f=s.facts.find(x=>x.id===t.dataset.f);if(!f)return;if(f.lastVal!==undefined){f.value=f.lastVal;delete f.lastVal;delete f.lastAt}f.state='live';f.sim=null;f.obs=st.now;f.nextChk=st.now+30000;f.script=null;st.settleUntil=performance.now()+1500;st.settleSvc=s.id;say(`${f.label} checked. Live again.`);refreshAll()},
 handoff,
 'dlg-close'(){$('#dlg').close()},
 'dlg-disc'(t){doDisconnect(t.dataset.id)},
 'dlg-revoke'(t){doRevoke(t.dataset.id)},
 reconnect(t){const id=t.dataset.id,s=svcs[id];st.note=null;startConnectWith(id,'reconnect',s.ref,'#/home');go('#/connect/reference')},
 'dismiss-note'(){st.note=null;renderView({})},
 'dismiss-journey'(){st.journeySeen=true;renderView({})},
 'skip-welcome'(){st.welcomeDone=true;st.replay=false;st.selected=st.selected||st.connected[0]||null;go('#/home')},
 'w-next'(){go('#/welcome/2')},
 'w-back'(){go('#/welcome/'+Math.max(1,st.beat-1))},
 'w-connect'(t){const id=t.dataset.id;if(!st.wscope[id].size)return;st.wstate[id]='delivering';connectSvc(id,{ref:'ref://'+id,scope:st.wscope[id],during:'first run'});renderNav();renderView({focus:true});
   const dur=matchMedia('(prefers-reduced-motion:reduce)').matches||st.motion==='reduce'?0:isPhone()?300:400;setTimeout(()=>{st.wstate[id]='done';renderView({focus:true});const b=$('#w-continue');b&&b.focus()},dur+60)},
 'w-continue'(){if(st.beat===2)go('#/welcome/3');else{st.welcomeDone=true;st.replay=false;go('#/home')}},
 'cx-next':cxNext,'cx-run':runTest,
 'cx-back'(){const i=STEPS.indexOf(route()[1]);go('#/connect/'+STEPS[Math.max(0,i-1)])},
 'cx-cancel'(){const to=st.cx.returnTo;st.cx=newCx();go(st.cx&&to&&to!=='#/home'?to:'#/home')},
 'cx-open'(){const id=st.cx.sid;st.cx=newCx();go('#/home/'+id)},
 'cx-more'(){st.cx=newCx();go('#/connect/discover')},
 'ref-replace'(t){st.replacing=t.dataset.id;renderView({});const i=$('#rep-ref');i&&i.focus()},
 'ref-cancel'(){const id=st.replacing;st.replacing=null;renderView({});const b=findFk('rep-'+id);b&&b.focus()},
 'ref-save'(t){const s=svcs[t.dataset.id],i=$('#rep-ref'),m=$('#rep-msg'),k=refCheck(i.value);
   if(k==='valid'){s.ref=i.value.trim();st.replacing=null;say(`${s.name}'s reference replaced.`);renderView({})}
   else if(k==='empty'){m.innerHTML=msgHTML('pristine');i.focus()}
   else{if(k==='secret')i.value='';m.innerHTML=msgHTML(k);i.setAttribute('aria-invalid','true');i.focus()}},
 'ref-remove'(t){openRevoke(t.dataset.id)},
 'ref-narrow'(t){const id=t.dataset.id;startConnectWith(id,'narrow',svcs[id].ref,'#/settings/references');go('#/connect/discover')},
 replay(){st.welcomeDone=false;st.replay=true;st.beat=1;st.wstate={};go('#/welcome/1')},
 journey(){st.journeySeen=false;go('#/home')},
 'mock-stale'(){const s=svcs['media-shelf'];const f=s.connected&&s.facts.find(x=>x.id==='media.items');if(!f){say('Connect Media Shelf first.');return}if(f.state!=='live'){say('Already not Live.');return}f.script={since:st.now};st.scripted.add(f.id);toStale(f,s);st.settleUntil=performance.now()+1500;st.settleSvc=s.id;say('Media Shelf is now Stale (simulated).');refreshAll()},
 'mock-refuse'(){const s=svcs['notes-sync'];if(!s.connected){say('Connect Notes Sync first.');return}s.refused=true;s.facts.forEach(f=>{if(f.state==='live'){f.state='stale';f.sim='stale';f.staleAt=st.now;f.refStale=true}});say('Notes Sync refused the reference.');refreshAll()},
 'mock-unscoped'(){const s=svcs['media-shelf'];if(!s.connected){say('Connect Media Shelf first.');return}s.scope=null;say('Media Shelf: unscoped connection.');refreshAll()},
 'hdr-back'(e){},'hdr-settings'(){},
 'reload-view'(){renderView({focus:true})}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act;
 if(t.getAttribute('aria-disabled')==='true'){e.preventDefault();if(a==='cx-next'||a==='cx-run'){const n={reference:'Add a valid reference and tick one scope.',test:'Pass the safe test first.',discover:'Pick a service.',preview:'Still fetching.'}[route()[1]];if(n&&a==='cx-next')say(n)}return}
 if(t.tagName==='A'&&(a==='owner'||a==='hdr-settings'||a==='hdr-back'))e.preventDefault();
 if(a==='hdr-back'){go(st.backTo||'#/home');return}
 if(a==='hdr-settings'){go('#/settings/services');return}
 if(ACT[a])ACT[a](t,e);
});
const CHG={
 'mem-filter'(t){st.memFilter=t.value;renderView({})},
 'cx-pick'(t){if(st.cx.mode==='narrow')return;pick(t.value);updateTop();const n=$('#cx-next');n&&n.removeAttribute('aria-disabled')},
 'cx-cap'(t){const c=st.cx;t.checked?c.scope.add(t.dataset.c):c.scope.delete(t.dataset.c);c.test={n:0,state:'idle',at:null};const m=$('#scope-sentence');if(m)m.innerHTML=`<strong>${c.scope.size?`Used only to read: ${esc(list([...c.scope]))}.`:'Tick at least one.'}</strong>`;updateRefUI()},
 'cx-fact'(t){const c=st.cx;if(!t.checked&&c.chosen.size<=1){t.checked=true;say('Keep at least one fact.');return}t.checked?c.chosen.add(t.dataset.f):c.chosen.delete(t.dataset.f);keepFocus(()=>renderView({}))},
 'cx-sim'(t){st.cx.simFail=t.checked},
 'w-cap'(t){const s=st.wscope[t.dataset.id];if(!t.checked&&s.size<=1){t.checked=true;return}t.checked?s.add(t.dataset.c):s.delete(t.dataset.c);keepFocus(()=>renderView({}))},
 cadence(t){st.cadence=Number(t.value);say(`Checking every ${st.cadence} seconds.`)},
 motion(t){st.motion=t.value;applyMotion();say(t.value==='reduce'?'Motion reduced. Data still updates.':'Motion follows system.')},
 theme(t){st.theme=t.value;applyTheme()}
};
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.chg;if(c&&CHG[c])CHG[c](t,e)});
document.addEventListener('input',e=>{if(e.target.id==='cx-ref')cxSetRef(e.target.value);else if(e.target.id==='rep-ref'){const m=$('#rep-msg');m&&(m.innerHTML=msgHTML('dirty'))}});
document.addEventListener('focusout',e=>{if(e.target.id==='cx-ref'&&st.cx.refState!=='pending'&&!$('#dlg').open)cxValidate()});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='cx-ref'){e.preventDefault();cxNext()}
 if(e.key==='Enter'&&e.target.id==='rep-ref'){e.preventDefault();const b=$('[data-act="ref-save"]');b&&b.click()}
 if(e.key==='Escape'&&!$('#dlg').open&&route()[0]==='connect'&&!e.defaultPrevented){const ph=st.cx.phase;if(ph==='confirm'){const to=st.cx.returnTo;st.cx=newCx();go(to||'#/home')}}
});
function applyTheme(){const h=document.documentElement;if(st.theme==='system')h.removeAttribute('data-theme');else h.setAttribute('data-theme',st.theme)}
function applyMotion(){const h=document.documentElement;if(st.motion==='reduce')h.setAttribute('data-motion','reduce');else h.removeAttribute('data-motion')}
window.addEventListener('hashchange',onRoute);
window.addEventListener('offline',()=>{st.offline=true;st.backOnline=false;updateTop();say('Offline. Showing what was last known, with times.')});
window.addEventListener('online',()=>{st.offline=false;st.backOnline=true;updateTop();say('Back online. Checking.');setTimeout(()=>{st.backOnline=false;updateTop()},3000)});
matchMedia('(max-width:47.99rem)').addEventListener('change',()=>{renderView({});updateTop()});
if(!navigator.onLine){st.offline=true}
if(!location.hash||location.hash==='#')history.replaceState(null,'','#/welcome/1');
onRoute();
})();
</script>
</body>
