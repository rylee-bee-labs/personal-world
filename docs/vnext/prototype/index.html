function nextTryTxt(i){if(!i.ladder)return'';const s=Math.max(0,Math.ceil((i.ladder.next-now())/1000));return 'Next try in '+(s<60?s+'s':Math.ceil(s/60)+'m')+'.'}

 else if(k==='stale')o.push(`No change seen since ${fmtT(i.checkedAt)}.`);

function newInstId(tid){let n=1;for(;;){const id=n===1?tid:tid+'-'+n;if(!st.inst[id]||!st.inst[id].connected)return id;n++}}
function ensureInst(id,tid){if(!st.inst[id])st.inst[id]=instBase(id,tid);return st.inst[id]}
function connectInst(id,tid,o){
 const i=ensureInst(id,tid),b=instBase(id,tid),n=id===tid?1:Number(id.split('-').pop())||2;
 Object.assign(i,b,{name:cleanName(o.name)||(n===1?b.name:b.name+' '+n)});
 const d=now()-T0;
 i.connected=true;i.ref=o.ref;i.heldRef=false;i.scope=o.scope?[...o.scope]:null;i.during=o.during;i.connectedAt=o.connectedAt||now();i.keptOut=o.omit||[];i.via=o.via||null;i.syn=!!o.syn;i.extra=o.extraFacts||0;
 i.facts=DEFS[tid].facts().filter(f=>!i.keptOut.includes(f.id));
 if(o.extraFacts)for(let n=1;n<=o.extraFacts;n++)i.facts.push(F('hub.sensor-'+n,'Sensor '+n,n*3,n%7===0?'jobs':'items','live','2026-10-13T14:24:00Z','local','read','read',{sample:true}));
 if((i.state==='healthy'||i.state==='needs_attention')&&i.checkedAt!=null)i.checkedAt+=d;
 i.facts.forEach(f=>{if(f.state==='live'){if(f.obs!=null)f.obs+=d;f.ok=now();f.next=(f.obs||now())+RECHECK}});
 if(i.state==='unavailable')i.ladder={rung:0,next:now()+15000*jit()};
 if(tid==='front-door'&&st.doorLocked)applyLock(i);
 if(!st.connected.includes(id)){if(o.at!=null)st.connected.splice(o.at,0,id);else st.connected.push(id)}
 st.selected=o.keepSel?st.selected||id:id;st.fact[id]=i.facts[0]&&i.facts[0].id;delete st.frames[id];st.lastOne=false;
 const f=i.facts.find(x=>x.state==='live');
 if(f&&!o.syn){
  if(tid==='media-shelf'&&!st.armMedia){st.armMedia=true;const m=i.facts.find(x=>x.id==='media.items');if(m)m.miss=true}
  else if(tid!=='media-shelf'&&i.via==='connect'&&!st.armConn){st.armConn=true;f.miss=true}

}
const jit=()=>0.8+Math.random()*0.4;
function applyLock(i){
 const b=i.facts.find(f=>f.id==='frontdoor.back-door'),u=i.facts.find(f=>f.id==='frontdoor.unlocked-for');
 const t=now();if(b){b.value='locked';b.obs=t;b.chg=t;b.next=t+30000}if(u){u.value=0;u.obs=t;u.chg=t;u.next=t+30000}
 i.state='healthy';i.reason=null;i.summary='Back door locked. Home still owns it.';i.checkedAt=t;
}

 Object.assign(st,{theme:o.theme||'dark',motion:o.motion||'follow',cadence:[5,10,30].includes(o.cadence)?o.cadence:5,times:o.times==='device'?'device':'utc',welcomeDone:!!o.welcomeDone,journeySeen:!!o.journeySeen,sort:['needs','name','recent','newest'].includes(o.sort)?o.sort:'needs'});
 if(o.filter&&typeof o.filter==='object')st.filter={q:'',chip:['all','needs','stale','unavailable','unknown'].includes(o.filter.chip)?o.filter.chip:'all'};
 if(o.mem&&typeof o.mem==='object')st.mem={svc:typeof o.mem.svc==='string'?o.mem.svc:'all',q:'',chip:['all','needs','stale','unavailable','unknown'].includes(o.mem.chip)?o.mem.chip:'all'};
 const order=Array.isArray(o.order)?o.order:[];
 const insts=o.instances.filter(x=>x&&typeof x.id==='string'&&DEFS[x.tid]);
 const conn=insts.filter(x=>x.connected).sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
 conn.forEach(x=>connectInst(x.id,x.tid,{name:x.name,ref:x.ref,scope:x.scope,during:x.during,omit:Array.isArray(x.keptOut)?x.keptOut:[],via:x.via,syn:x.syn,extraFacts:Number(x.extra)||0,restore:true,connectedAt:Math.min(Number(x.connectedAt)||T0,T0),keepSel:true}));

/* the silence rule and the re-check rule, run over mock time. Returns what changed so the caller can ripple, say and log once. */
const STALE_AT=90000,UNKNOWN_AT=150000,RECHECK=30000;
function lastOk(f){return f.ok!=null?f.ok:f.obs}
function advance(to){
 const changes=[];let guard=0;
 for(;;){
  let ev=null;const take=(t,type,i,f)=>{if(!ev||t<ev.t)ev={t,type,i,f}};
  for(const id of st.connected){const i=st.inst[id];
   for(const f of i.facts){
    if(rechecking(i,f)){
     if(f.next!=null&&f.next<=to)take(f.next,'chk',i,f);
     const ok=lastOk(f);
     if(ok!=null&&ok+STALE_AT<=to)take(ok+STALE_AT,'stale',i,f);
    }else if(f.sim==='stale'&&!f.refStale&&f.state==='stale'){const ok=lastOk(f);if(ok!=null&&ok+UNKNOWN_AT<=to)take(ok+UNKNOWN_AT,'unknown',i,f)}
   }
   if(i.ladder&&i.state==='unavailable'&&i.ladder.next<=to)take(i.ladder.next,'ladder',i,null);
  }
  if(st.undo&&!st.undo.expired&&st.undo.until<=to)take(st.undo.until,'undo',null,null);
  if(!ev||++guard>4000)break;
  const{t,type,i,f}=ev;
  if(type==='chk'){if(f.miss){f.next=t+RECHECK}else{f.obs=t;f.ok=t;f.next=t+RECHECK;if(i.state==='healthy')i.checkedAt=t}}
  else if(type==='stale'){f.state='stale';f.sim='stale';f.staleAt=t;f.chg=t;changes.push({i,f,to:'stale',t})}
  else if(type==='unknown'){f.lastVal=f.value;f.lastAt=f.obs;f.value=null;f.state='unknown';f.sim='unknown';f.chg=t;changes.push({i,f,to:'unknown',t})}
  else if(type==='ladder'){const L=i.ladder,S=[15,30,60,120,300];L.rung++;L.next=t+S[Math.min(L.rung,4)]*1000*jit()}
  else if(type==='undo'){st.undo.expired=true;st.undo.snap=null;changes.undoExpired=true}
 }
 return changes;
}

/* ---------- FreshnessBadge: the word and the age. live (to 45s) -> ageing (to 90s, still Live, "re-checking") -> stale (90s) -> unknown (150s) ---------- */

function freshest(){const ts=st.connected.map(id=>st.inst[id].checkedAt).filter(x=>x!=null);return ts.length?Math.max(...ts):null}

function Skeleton(what,shape='dot-line',key='',extra=''){

/* waits get words only: 3s "Still reading. 4s.", 6s "Stalled?", 10s timeout. Registered per key, ticked once a second */
const waits={};
function waitStart(key,o){waits[key]=Object.assign({t0:performance.now()},o)}
function waitStop(key){delete waits[key]}
function waitHTML(key,i){const w=waits[key];if(!w)return'';const s=Math.floor((performance.now()-w.t0)/1000);if(s<3)return'';return`Still reading. ${s}s.${s>=6?` Stalled? ${i?ownerLink(i,'text','stalled-'+key.replace(/\W/g,'')):''}`:''}`}
function tickWaits(){
 for(const k of Object.keys(waits)){
  const w=waits[k],s=(performance.now()-w.t0)/1000;
  $$(`[data-wait="${CSS.escape(k)}"]`).forEach(el=>{const h=waitHTML(k,w.inst);if(el.innerHTML!==h)el.innerHTML=h});
  if(s>=10&&w.onTimeout){const f=w.onTimeout;delete waits[k];f()}
 }
}

/* ---------- Toast + live region: one polite status region, one assertive alert, both created once and never re-rendered ---------- */
const speak={buf:[],timer:null,last:0};
function announce(msg){if(!msg)return;if(!speak.buf.includes(msg))speak.buf.push(msg);if(!speak.timer)speak.timer=setTimeout(flushSpeak,500)}
function flushSpeak(){
 speak.timer=null;
 const wait=2000-(performance.now()-speak.last);
 if(wait>0&&speak.last){speak.timer=setTimeout(flushSpeak,wait);return}
 const m=speak.buf.splice(0).join(' · ');if(!m)return;
 speak.last=performance.now();const r=$('#live-polite');r.textContent='';setTimeout(()=>{r.textContent=m},30);
}
function alertNow(msg){const a=$('#live-alert');a.textContent='';setTimeout(()=>{a.textContent=msg},30)}
const tq={q:[],cur:null,timer:null,hover:false,left:0,t:0};
/* say(text, {kind:'info|done|failed', action:{label,act,id}, loud, silent, persist}) */
function say(text,o={}){
 if(o.loud)alertNow(text);else if(!o.silent)announce(text);
 if(o.noToast)return;
 const t=Object.assign({text,kind:o.kind||'info'},o);
 if(tq.cur&&tq.cur.text===text&&!o.action){return}
 if(o.action){tq.q.unshift(t);nextToast()}else{tq.q.push(t);if(!tq.cur)nextToast()}
}
function nextToast(){
 clearTimeout(tq.timer);const t=tq.q.shift();tq.cur=t||null;
 const slot=$('#toast-slot');
 if(!t){slot.innerHTML='';return}
 const dur=t.action&&t.action.act==='undo'?Infinity:Math.max(4000,60*t.text.length)*(paused()?2:1);
 tq.left=dur;tq.t=performance.now();
 const act=t.action?`<div class="actions">${t.action.act==='undo'?`<button type="button" class="btn" data-act="undo" data-fk="toast-undo"><span data-ak="u|">${undoTxt()}</span></button>`:`<button type="button" class="btn" data-act="${t.action.act}" data-id="${esc(t.action.id||'')}" data-fk="toast-action">${esc(t.action.label)}</button>`}<button type="button" class="btn text" data-act="toast-dismiss" data-fk="toast-dismiss">Dismiss</button></div>`:'';
 slot.innerHTML=`<div class="toast ${t.kind==='failed'?'failed':''}" data-toast><p>${esc(t.text)}</p>${act}</div>`;
 const el=slot.firstChild;
 el.addEventListener('mouseenter',()=>holdToast(true));el.addEventListener('mouseleave',()=>holdToast(false));
 el.addEventListener('focusin',()=>holdToast(true));el.addEventListener('focusout',()=>holdToast(false));
 armToast();
}
function armToast(){clearTimeout(tq.timer);if(tq.left===Infinity||tq.hover)return;tq.t=performance.now();tq.timer=setTimeout(()=>{tq.timer=null;if(tq.hover)return;nextToast()},tq.left)}
function holdToast(h){tq.hover=h;if(h){clearTimeout(tq.timer);if(tq.left!==Infinity)tq.left=Math.max(1500,tq.left-(performance.now()-tq.t))}else armToast()}
function dismissToast(){tq.hover=false;nextToast()}

/* ---------- OptimisticAction: do it now, settle it, or roll it back ---------- */
const lat=m=>m*(0.75+Math.random()*0.5)*(st.slow?8:1);
const takeFail=k=>{if(st.fail[k]){st.fail[k]=false;store.emit('fail');return true}return false};
const mock=(m,failWith)=>new Promise((res,rej)=>setTimeout(()=>failWith?rej(new Error(failWith)):res(),lat(m)));
const onceKey=k=>{if(st.once.has(k))return false;st.once.add(k);return true};
const release=k=>st.once.delete(k);
async function optimistic(o){
 if(o.key&&!onceKey(o.key))return false;
 if(o.btn)o.btn.setAttribute('aria-disabled','true');
 const epoch=st.epoch,alive=()=>!o.guard||o.guard(epoch);
 try{
  o.apply&&o.apply();
  await mock(o.ms==null?350:o.ms,o.failWhen&&o.failWhen());
  if(alive())o.settle&&o.settle();
  return true;
 }catch(e){
  o.undo&&o.undo();
  const a=alive();
  if(a&&o.failText)say(o.failText,{kind:'failed',loud:!!o.loud});
  logEvt({kind:'fail',text:o.failText||'Failed.',svc:o.svc||''});
  a&&o.after&&o.after(e);
  return false;
 }finally{o.key&&release(o.key)}
}

/* ---------- app frame (S2): loading, loaded, refused, timeout, cancelled. Starts only when its pane is in view ---------- */
function startFrame(id){const fr=st.frames[id];if(fr&&fr.state!=='idle')return;if(!fr)st.frames[id]={state:'idle',tries:0};loadFrame(id)}
function loadFrame(id){
 const i=st.inst[id];if(!i||!i.connected)return;
 const fr=st.frames[id]||(st.frames[id]={state:'idle',tries:0});
 clearTimeout(fr.t);clearTimeout(fr.hard);fr.state='loading';fr.tries++;
 const m=st.frameMode,plan=m==='refused'?'refused':m==='slow'?'slow':m==='never'?'never':fr.tries<=2?'refused':'ok';
 waitStart('frame-'+id,{inst:i});paintFrame(id);
 const to=state=>{if(fr.state!=='loading')return;fr.state=state;waitStop('frame-'+id);paintFrame(id);if(fr.tries>1&&state!=='loaded')announce("Didn't load here.")};
 fr.hard=setTimeout(()=>to('timeout'),8000);
 if(plan==='ok')fr.t=setTimeout(()=>to('loaded'),lat(900));
 else if(plan==='refused')fr.t=setTimeout(()=>to('refused'),lat(700));
 else if(plan==='slow')fr.t=setTimeout(()=>to('loaded'),lat(6000));
}

 else{const cause=fr.state==='timeout'?'Too slow.':fr.state==='cancelled'?'Cancelled.':"It won't show inside another page.";body=`<div class="frame-body"><p><strong>Didn't load here.</strong></p><p class="muted">${cause} Use the link, or try again.</p></div>`;ctl=`<button type="button" class="btn" data-act="frame-retry" data-id="${esc(i.id)}">Try again</button>`}

const CHIPS=[['all','All'],['needs','Needs you'],['stale','Stale'],['unavailable','Unavailable'],['unknown','Unknown']];
const chipMatch=(i,c)=>{if(c==='all')return true;const k=svcState(i)[0];return c==='needs'?k==='needs_attention':k===c};
const RANK={needs_attention:0,unavailable:1,stale:2,unknown:3,healthy:4,not_configured:5};
function visibleIds(){
 const q=st.filter.q.trim().toLowerCase();
 let ids=st.connected.map(id=>st.inst[id]).filter(i=>chipMatch(i,st.filter.chip)&&(!q||[i.name,i.kind,i.owner.app].concat(i.facts.map(f=>f.label)).some(x=>String(x).toLowerCase().includes(q))));
 const idx=id=>st.connected.indexOf(id);
 if(st.sort==='name')ids.sort((a,b)=>a.name.localeCompare(b.name));
 else if(st.sort==='recent')ids.sort((a,b)=>(b.checkedAt??-1)-(a.checkedAt??-1));
 else if(st.sort==='newest')ids.sort((a,b)=>idx(b.id)-idx(a.id));
 else ids.sort((a,b)=>(svcState(a)[0]==='needs_attention'?0:1)-(svcState(b)[0]==='needs_attention'?0:1)||idx(a.id)-idx(b.id));
 return ids;
}
function slipsHTML(){

 if(all>12){
  const g={};ids.forEach(i=>{const k=svcState(i)[0];(g[k]=g[k]||[]).push(i)});
  return Object.keys(g).sort((a,b)=>(RANK[a]??9)-(RANK[b]??9)).map(k=>{const dk='grp-'+k,open=st.open[dk]!==undefined?st.open[dk]:true;return`<details class="group" data-dk="${dk}" ${open?'open':''}><summary>${esc(SW[k]?SW[k][1]:k)} · ${g[k].length}</summary><ul class="slips">${g[k].map(i=>ServiceCard(i,'slip')).join('')}</ul></details>`}).join('');
 }
 return`<ul class="slips">${ids.map(i=>ServiceCard(i,'slip')).join('')}</ul>`;
}
function finderHTML(){

/* ---------- Connect (C1-C6): Discover, Reference, Test, Preview, Choose, Publish ---------- */
const STEPS=['discover','reference','test','preview','choose','publish'],SN=['Discover','Reference','Test','Preview','Choose','Publish'];
const isSecretShape=v=>/^(sk-|pk-|ghp_|gho_|ghs_|github_pat_|xox[abprs]-|AKIA|AIza|eyJ|-----BEGIN)/.test(v)||/[0-9a-fA-F]{32,}/.test(v)||(!/^ref:\/\//i.test(v)&&/^[A-Za-z0-9+\/=_-]{24,}$/.test(v));
function refCheck(v){
 v=(v||'').trim();if(!v)return'empty';
 if(isSecretShape(v))return'secret';
 const m=/^ref:\/\/([A-Za-z0-9][A-Za-z0-9_-]{0,48})$/.exec(v);
 if(!m)return'notref';
 if(/^(PW_|OIDC_)/i.test(m[1])||/BOOTSTRAP/i.test(m[1]))return'own';
 return'valid';
}
const REFMSG={pristine:['','Use the form ref://name.'],dirty:['','Checked when you leave the field.'],valid:['done','Looks like a reference.'],notref:['failed','Not a reference. Use ref://name.'],secret:['failed','That looks like a secret. Cleared, not saved. Use a reference, like ref://notes-sync.'],own:['failed',"That points at one of Worlds' own secrets. Can't use it here."],pending:['','Saving…'],testing:['','Testing…'],saveFail:['failed',"Couldn't save. Nothing was changed."]};
const msgHTML=(k,extra)=>{const[c,t]=REFMSG[k]||['',k];return`${c==='done'?svg(GL.check,'c-done'):c==='failed'?svg(GL.x,'c-failed'):''}<span class="${c?'c-'+c:''}">${extra?esc(extra):t}</span>`};
const refLen=v=>{const m=/^ref:\/\/(.*)$/i.exec(v||'');return m?cp(m[1]).length:0};
const cxInst=()=>{const c=st.cx;return c.iid?st.inst[c.iid]:null};
const cxName=()=>{const c=st.cx;if(c.pubId&&st.inst[c.pubId]&&c.phase!=='confirm')return st.inst[c.pubId].name;if(c.iid&&st.inst[c.iid])return st.inst[c.iid].name;if(!c.tid)return'';const id=newInstId(c.tid),n=id===c.tid?1:Number(id.split('-').pop());return n===1?DEFS[c.tid].name:DEFS[c.tid].name+' '+n};
const scopeOk=c=>c.scope.size>0||!(c.tid&&caps(c.tid).length);
const connectedN=tid=>st.connected.filter(id=>st.inst[id].tid===tid).length;
function cxGuard(step){
 const c=st.cx,i=STEPS.indexOf(step);if(i<0)return'discover';
 if(c.mode==='replace'||c.mode==='narrow'&&c.tid)return i>=1?'reference':'discover';
 if(i>=1&&!c.tid)return'discover';
 if(i>=2&&!(c.refState==='valid'&&scopeOk(c)))return'reference';
 if(i>=3&&c.test.state!=='passed')return'test';
 if(i>=5&&!c.chosen.size&&DEFS[c.tid].facts().length)return'choose';
 return step;
}
function pick(tid){const c=st.cx,keep=c.mode;Object.assign(c,newCx(),{mode:keep==='narrow'?'narrow':'new',tid,scope:new Set(caps(tid)),chosen:new Set(DEFS[tid].facts().map(f=>f.id))})}
function cxBar(step){
 const c=st.cx,i=STEPS.indexOf(step);
 if(step==='publish'&&(c.phase==='delivering'||c.phase==='done'))return'';
 const rep=c.mode==='replace'||c.mode==='narrow'||c.mode==='reconnect';
